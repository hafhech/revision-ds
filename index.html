function modeName(id){
  if(id==='all') return 'Toute la série';
  if(id==='err') return 'Mes erreurs';
  if(id==='timed') return 'Contre la montre';
  var k = parseInt(id.slice(2),10); return cur.ch[k] ? cur.ch[k].t+' · '+cur.ch[k].n : '';
}
function startQuiz(id){
  var S = cur, list;
  if(id==='all' || id==='timed') list = S.bank.slice();
  else if(id==='err') list = S.bank.filter(function(q){ return store[q.id]===0; });
  else list = S.bank.filter(function(q){ return q.ch===parseInt(id.slice(2),10); });
  if(id==='timed'){ list = shuffle(list).slice(0,TIMED_N); }
  else {
    if(opts.shuffle) list = shuffle(list);
    if(opts.len && list.length>opts.len) list = list.slice(0,opts.len);
  }
  session = {list:list, i:0, done:false, res:{}, sel:null, label:id, mode:modeName(id), timed:id==='timed', endsAt:id==='timed'?Date.now()+TIMED_SEC*1000:0};
  clearTimer();
  if(session.timed){ timer = setInterval(tick,1000); }
  viewQuestion();
}
function fmtTime(ms){ var s = Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
function tick(){
  if(!session || !session.timed){ clearTimer(); return; }
  var left = session.endsAt - Date.now();
  var el = document.getElementById('timer');
  if(el) el.textContent = fmtTime(left);
  if(left<=0){ clearTimer(); viewResult(); }
}
function currentQ(){ return session.list[session.i]; }
function viewQuestion(){
  var S = cur, q = currentQ(), n = session.list.length;
  var ok = Object.keys(session.res).filter(function(k){return session.res[k];}).length;
  setCrumbs(lvCrumbs(S));
  session.done = false; session.sel = null;
  q._order = q.t==='qcm' ? (q.noshuffle ? q.c.map(function(t,i){return {t:t,i:i};}) : shuffle(q.c.map(function(t,i){return {t:t,i:i};}))) : null;
  var html = '<div class="quizbar"><button class="link" id="quit">← Quitter</button><div class="count">Question <b>'+(session.i+1)+'</b> / '+n+'</div>'+
    (session.timed?'<div class="clock" aria-label="Temps restant">⏱ <b id="timer">'+fmtTime(session.endsAt-Date.now())+'</b></div>':'')+
    '<div class="score" aria-label="Bonnes réponses">✓ '+ok+'</div></div>'+
    '<div class="progress" aria-hidden="true"><i style="width:'+(100*session.i/n)+'%"></i></div>'+
    '<article class="card qcard"><div class="tags"><span class="chip">'+S.ch[q.ch].t+' · '+S.ch[q.ch].n+'</span><span class="chip kind">'+q.k+'</span></div>'+
    '<p class="prompt">'+q.q+'</p>';
  if(q.fig) html += '<figure class="fig" id="fig">'+figure(q,[])+'<figcaption>'+(q.fig==='tr'?'Chaque carreau mesure une unité':'Figure non à l’échelle')+'</figcaption></figure>';
  html += '<div id="answer">';
  if(q.t==='qcm'){
    html += '<div class="choices" role="group" aria-label="Réponses possibles">'+q._order.map(function(o,k){ return '<button class="opt" data-k="'+k+'" aria-pressed="false"><span class="l">'+'ABCD'[k]+'</span><span>'+o.t+'</span></button>'; }).join('')+'</div>';
  } else if(q.t==='vf'){
    html += '<div class="choices vf" role="group" aria-label="Vrai ou faux"><button class="opt" data-k="1" aria-pressed="false">Vrai</button><button class="opt" data-k="0" aria-pressed="false">Faux</button></div>';
  } else {
    var ph = q.t==='num' ? 'ex. 36' : (q.t==='pow' ? 'ex. 4^2 ou 4²' : (q.t==='frac' ? 'ex. 3/4' : 'ta réponse'));
    html += '<div class="field"><label class="muted" for="ans" style="width:100%;font-size:15px">Ta réponse</label><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+ph+'">'+(q.unit?'<span class="unit">'+q.unit+'</span>':'')+'</div>';
    var keys = q.t==='num' ? ['−'] : (q.t==='pow' ? ['²','³','^'] : (q.t==='frac' ? ['/'] : ['×','²','(',')','+','−']));
    html += '<div class="keys" aria-label="Touches utiles">'+keys.map(function(k){return '<button type="button" data-key="'+k+'" aria-label="Insérer '+k+'">'+k+'</button>';}).join('')+'</div>';
  }
  html += '</div><div class="actions" id="actions"><button class="btn" id="check">Valider</button><button class="btn ghost" id="skip">Je ne sais pas</button></div><div id="fb" aria-live="polite"></div></article>';
  app.innerHTML = html;
  document.getElementById('quit').onclick = function(){ clearTimer(); if(Object.keys(session.res).length) viewResult(); else { session=null; nav(S.id); } };
  document.getElementById('check').onclick = function(){ submit(false); };
  document.getElementById('skip').onclick = function(){ submit(true); };
  Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
    b.onclick = function(){
      if(session.done) return;
      session.sel = parseInt(b.getAttribute('data-k'),10);
      Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });
      if(q.t==='vf') submit(false);
    };
  });
  var inp = document.getElementById('ans');
  if(inp){
    inp.focus({preventScroll:true});
    Array.prototype.forEach.call(app.querySelectorAll('[data-key]'), function(b){
      b.onclick = function(){
        var k = b.getAttribute('data-key'), s = inp.selectionStart==null?inp.value.length:inp.selectionStart, e = inp.selectionEnd==null?s:inp.selectionEnd;
        inp.value = inp.value.slice(0,s)+k+inp.value.slice(e); inp.focus(); var p = s+k.length; inp.setSelectionRange(p,p);
      };
    });
  }
  window.scrollTo(0,0);
}
function answerText(q){
  if(q.t==='qcm') return q.c[q.a];
  if(q.t==='vf') return q.a ? 'Vrai' : 'Faux';
  if(q.t==='num') return fr(q.a)+(q.unit?' '+q.unit:'');
  if(q.t==='frac'){ var pp = String(q.a).split('/'); return pp.length>1 ? '<span class="fr"><span>'+pp[0]+'</span><span>'+pp[1]+'</span></span>' : pp[0]; }
  return q.show;
}
function submit(skipped){
  if(session.done) return;
  var q = currentQ(), res;
  if(skipped){ res = {ok:false, skipped:true}; }
  else if(q.t==='qcm'){
    if(session.sel==null){ showMsg('Choisis une réponse avant de valider.'); return; }
    res = {ok: q._order[session.sel].i===q.a};
  } else if(q.t==='vf'){
    if(session.sel==null){ showMsg('Choisis Vrai ou Faux.'); return; }
    res = {ok: (session.sel===1)===q.a};
  } else {
    var raw = document.getElementById('ans').value;
    if(!raw.trim()){ showMsg('Écris ta réponse avant de valider.'); return; }
    res = check(q, raw);
  }
  session.done = true;
  session.res[q.id] = res.ok;
  store[q.id] = res.ok ? 1 : 0; save();
  if(q.t==='qcm'){
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b,k){
      b.disabled = true;
      if(q._order[k].i===q.a) b.classList.add('right');
      else if(k===session.sel && !res.ok) b.classList.add('wrong');
    });
  } else if(q.t==='vf'){
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
      b.disabled = true; var v = b.getAttribute('data-k')==='1';
      if(v===q.a) b.classList.add('right'); else if(!res.ok && parseInt(b.getAttribute('data-k'),10)===session.sel) b.classList.add('wrong');
    });
  } else { document.getElementById('ans').disabled = true; Array.prototype.forEach.call(app.querySelectorAll('[data-key]'), function(b){b.disabled=true;}); }
  if(q.fig && q.hi && q.hi.length){ document.getElementById('fig').innerHTML = figure(q,q.hi)+'<figcaption>Les éléments concernés sont surlignés</figcaption>'; }
  else if(q.fig && q.hi){ document.getElementById('fig').innerHTML = figure(q,q.hi)+'<figcaption>'+(q.fig==='tr'?'Chaque carreau mesure une unité':'Figure non à l’échelle')+'</figcaption>'; }
  var last = session.i === session.list.length-1;
  var head = res.ok ? '✓ Bonne réponse' : (res.skipped ? 'Voici la réponse' : '✗ Pas tout à fait');
  var body = '';
  if(res.ok && res.note) body += '<p>'+res.note+'</p>';
  if(!res.ok){ if(res.msg) body += '<p>'+res.msg+'</p>'; body += '<p>Réponse attendue : <b>'+answerText(q)+'</b></p>'; }
  body += '<div class="exp">'+q.e+'</div>';
  document.getElementById('fb').innerHTML = '<div class="fb '+(res.ok?'good':'bad')+'"><div class="h">'+head+'</div>'+body+'</div>';
  document.getElementById('actions').innerHTML = '<button class="btn" id="next">'+(last?'Voir mon résultat':'Question suivante →')+'</button>';
  var nx = document.getElementById('next');
  nx.onclick = next; nx.focus({preventScroll:false});
  var sc = app.querySelector('.score'); if(sc) sc.textContent = '✓ '+Object.keys(session.res).filter(function(k){return session.res[k];}).length;
}
function showMsg(t){
  document.getElementById('fb').innerHTML = '<p class="muted" style="margin:14px 0 0">'+t+'</p>';
}
function next(){
  if(session.i < session.list.length-1){ session.i++; viewQuestion(); }
  else { clearTimer(); viewResult(); }
}
function viewResult(){
  clearTimer();
  var S = cur;
  setCrumbs(lvCrumbs(S));
  var ids = Object.keys(session.res);
  var tot = session.timed ? session.list.length : ids.length;
  var ok = ids.filter(function(k){return session.res[k];}).length;
  var per = {}, miss = 0;
  S.chs.forEach(function(k){ per[k] = [0,0]; });
  session.list.forEach(function(q){
    if(q.id in session.res){ per[q.ch][1]++; if(session.res[q.id]) per[q.ch][0]++; else miss++; }
    else if(session.timed){ per[q.ch][1]++; miss++; }
  });
  var pct = tot ? ok/tot : 0;
  var msg = pct>=.9 ? 'Excellent. Tu maîtrises ces notions.' : pct>=.7 ? 'Très bien. Relis les rappels des questions ratées.' : pct>=.5 ? 'C’est un bon début. Refais tes erreurs pour progresser.' : 'Reprends le cours, puis recommence la série : tu vas progresser vite.';
  var rows = '';
  S.chs.forEach(function(k){
    if(!per[k][1]) return;
    rows += '<div class="row"><span><b>'+S.ch[k].t+'</b> · '+S.ch[k].n+'</span><span class="muted">'+per[k][0]+' / '+per[k][1]+'</span><span class="progress" aria-hidden="true"><i style="width:'+(100*per[k][0]/per[k][1])+'%"></i></span></div>';
  });
  var date = new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  var name = getName();
  app.innerHTML = '<section class="card result"><p class="eyebrow">Résultat</p><p style="margin:0">'+msg+'</p>'+
    '<div class="ticket" id="ticket"><div class="t1">'+S.title+' · '+sup(S.lv)+'</div><div class="t2">'+session.mode+'</div><div class="big-score">'+ok+'<small> / '+tot+'</small></div><div class="t3"><span id="who">'+(name?name.replace(/[<>&]/g,''):'Ton prénom')+'</span> · '+date+'</div></div>'+
    '<p class="muted" style="text-align:center;margin:0 0 8px;font-size:15px">Ton résultat a été transmis à Madame Hechaichi.</p>'+
    '<div class="breakdown">'+rows+'</div>'+
    '<div class="actions" style="justify-content:center"><button class="btn" id="again-err"'+(miss && !session.timed?'':' disabled')+'>Refaire mes erreurs</button><button class="btn ghost" id="again">Choisir une autre série</button></div></section>';
  if(tot>0 && !session.sent){ session.sent = true; sendScore(name||'(sans prénom)', S.title+' ('+S.lv+') · '+session.mode, ok+' / '+tot); }
  document.getElementById('again').onclick = function(){ session=null; nav(S.id); };
  var ae = document.getElementById('again-err');
  var wrong = session.list.filter(function(q){ return session.res[q.id]===false; });
  ae.disabled = !wrong.length;
  ae.onclick = function(){ if(!wrong.length) return; var list = opts.shuffle ? shuffle(wrong) : wrong; session = {list:list,i:0,done:false,res:{},sel:null,label:'err',mode:'Mes erreurs',timed:false,endsAt:0}; viewQuestion(); };
  window.scrollTo(0,0);
}

/* ---------- routage ---------- */
function route(){
  clearTimer();
  var r = (location.hash||'').replace('#','');
  var m;
  if(r==='6e') return viewLevel('6e');
  if(r==='5e') return viewLevel('5e');
  if(r==='4e') return viewLevel('4e');
  if((m = /^([a-z0-9]+)$/.exec(r)) && SERIES[m[1]]){ cur = SERIES[m[1]]; return viewSetup(); }
  if((m = /^([a-z0-9]+)c(\d)$/.exec(r)) && SERIES[m[1]] && SERIES[m[1]].ch[m[2]]){ cur = SERIES[m[1]]; return viewCours(parseInt(m[2],10)); }
  return viewHome();
}
window.addEventListener('hashchange', function(){ session = null; route(); });
document.getElementById('brand').onclick = function(){ session=null; nav('accueil'); };
document.addEventListener('keydown', function(e){
  if(!session || e.defaultPrevented) return;
  var tgt = e.target;
  if(e.key==='Enter'){
    if(session.done){ var nx = document.getElementById('next'); if(nx && tgt!==nx){ e.preventDefault(); next(); } }
    else if(document.getElementById('check') && tgt.tagName!=='BUTTON'){ e.preventDefault(); submit(false); }
  } else if(!session.done && /^[1-4]$/.test(e.key) && tgt.tagName!=='INPUT'){
    var q = currentQ();
    if(q && q.t==='qcm'){ var btn = app.querySelector('.opt[data-k="'+(parseInt(e.key,10)-1)+'"]'); if(btn) btn.click(); }
  }
});
route();
})();
</script>
