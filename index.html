<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision DS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
/* Plan : cahier à carreaux. Stylo bleu (accent), surligneur jaune, vert/rouge pour juste/faux.
   Mise en page : une colonne étroite, grandes zones tactiles, cartes posées sur le quadrillage. */
:root{
  --paper:#f2f6fc; --grid:#dce5f2; --surface:#ffffff; --ink:#13203b; --muted:#56678a;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e3ebff;
  --hl:#ffe27a; --hl-ink:#3a2f00;
  --good:#12703f; --good-bg:#e2f4ea; --bad:#b0302b; --bad-bg:#fcebe8;
  --line:#cdd7e8; --shadow:0 1px 0 rgba(19,32,59,.06), 0 6px 18px -10px rgba(19,32,59,.25);
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1526; --grid:#1a2540; --surface:#162038; --ink:#e8edf8; --muted:#9fb0cf;
    --accent:#86a8ff; --accent-ink:#0b1226; --accent-soft:#1f2d52;
    --hl:#7a6516; --hl-ink:#fff4c2;
    --good:#5fd39b; --good-bg:#143428; --bad:#ff8f87; --bad-bg:#3a1c1b;
    --line:#2a3858; --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1526; --grid:#1a2540; --surface:#162038; --ink:#e8edf8; --muted:#9fb0cf;
  --accent:#86a8ff; --accent-ink:#0b1226; --accent-soft:#1f2d52;
  --hl:#7a6516; --hl-ink:#fff4c2;
  --good:#5fd39b; --good-bg:#143428; --bad:#ff8f87; --bad-bg:#3a1c1b;
  --line:#2a3858; --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px; color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.5;
}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 56px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{font-family:var(--display);font-weight:800;font-size:22px;background:none;border:0;cursor:pointer;padding:6px 2px;letter-spacing:-.01em}
mark{background:var(--hl);color:var(--hl-ink);padding:0 .22em;border-radius:3px;box-decoration-break:clone}
.crumbs{font-size:15px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs button{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.eyebrow{margin:0 0 8px;font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.hero{padding:20px 0 8px}
.hero h1{font-size:clamp(40px,9vw,64px);font-weight:800;letter-spacing:-.02em}
.lede{margin:12px 0 0;max-width:46ch;font-size:20px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.level{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:16px;text-align:left;cursor:pointer;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .12s, box-shadow .12s}
.level:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.level .big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.level .big sup{font-size:.4em;vertical-align:top;position:relative;top:.15em}
.level .sub{font-size:15px;color:var(--muted)}
.level.soon{border-style:dashed;box-shadow:none;background:transparent}
.level.soon:hover{transform:none;box-shadow:none}
.level.open{border-color:var(--accent);box-shadow:4px 4px 0 var(--accent)}
.level.open:hover{box-shadow:6px 6px 0 var(--accent)}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid currentColor;align-self:flex-start}
.pill.ok{color:var(--accent)} .pill.wait{color:var(--muted)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
h2.title{font-size:clamp(30px,6vw,40px);font-weight:800;margin:14px 0 6px}
.muted{color:var(--muted)}
.setcard{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.setcard h3{font-size:28px}
.progress{height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:12px;border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.link{background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:8px 0}
.chaps{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}
.chap{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;cursor:pointer;width:100%}
.chap:hover{border-color:var(--accent)}
.chap .num{font-family:var(--display);font-weight:800;font-size:30px;background:var(--hl);color:var(--hl-ink);border-radius:10px;width:52px;height:52px;display:grid;place-items:center}
.chap.all .num{background:var(--accent);color:var(--accent-ink)}
.chap.err .num{background:var(--bad-bg);color:var(--bad)}
.chap h3{font-size:21px}
.chap .meta{font-size:15px;color:var(--muted)}
.chap .progress{grid-column:2 / 4;height:7px}
.chap .go{font-weight:700;color:var(--accent)}
.chap[disabled]{opacity:.55;cursor:not-allowed}
.opts{display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:20px;align-items:center}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer;min-height:40px}
.opts input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.opts select{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px}
.reset{margin-top:22px;font-size:15px}
/* quiz */
.quizbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 8px;font-size:16px}
.quizbar .count b{font-variant-numeric:tabular-nums}
.score{font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}
.qcard{margin-top:14px;padding:20px 18px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.kind{background:var(--hl);color:var(--hl-ink)}
.prompt{font-size:21px;line-height:1.45;margin:0 0 16px}
.prompt sup{font-size:.7em;line-height:0}
.hat{position:relative;display:inline-block}
.hat::before{content:"^";position:absolute;left:0;right:0;top:-.42em;text-align:center;font-size:.95em}
figure.fig{margin:0 0 16px;background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:8px;text-align:center}
figure.fig svg{max-width:100%;height:auto;max-height:240px}
figure.fig figcaption{font-size:14px;color:var(--muted)}
.fig .ln{stroke:var(--ink);stroke-width:2;fill:none}
.fig .mk{stroke:var(--ink);stroke-width:1.6;fill:none}
.fig .tx{fill:var(--ink);font:italic 16px var(--body)}
.fig .nb circle{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.fig .nb text{fill:var(--ink);font:700 12px var(--body);text-anchor:middle;dominant-baseline:central}
.fig .nb.hi circle{fill:var(--hl);stroke:var(--ink)}
.fig .nb.hi text{fill:var(--hl-ink)}
.choices{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px;width:100%}
.opt:hover{border-color:var(--accent)}
.opt .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.right .l{background:var(--good);color:var(--surface)}
.opt.wrong .l{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.vf{grid-template-columns:1fr 1fr}
.vf .opt{grid-template-columns:1fr;text-align:center;font-weight:700;font-size:20px}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field input[type=text]{flex:1 1 180px;min-width:0;min-height:54px;font-size:22px;padding:8px 14px;border-radius:12px;border:2px solid var(--ink);background:var(--surface);font-variant-numeric:tabular-nums}
.field input[disabled]{opacity:.8}
.field .unit{font-weight:700;color:var(--muted)}
.keys{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.keys button{min-width:46px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:19px}
.keys button:hover{border-color:var(--accent)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.fb{margin-top:18px;border-radius:12px;padding:14px 16px;border:2px solid}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb .h{font-weight:700;font-size:19px}
.fb.good .h{color:var(--good)} .fb.bad .h{color:var(--bad)}
.fb p{margin:6px 0 0}
.fb .exp{background:var(--surface);border-radius:8px;padding:8px 12px;margin-top:10px;border-left:5px solid var(--hl)}
.fb .exp::before{content:"Rappel du cours";display:block;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
/* result */
.result{margin-top:16px;text-align:center}
.big-score{font-family:var(--display);font-weight:800;font-size:clamp(56px,16vw,92px);line-height:1;font-variant-numeric:tabular-nums}
.big-score small{font-size:.4em;color:var(--muted)}
.breakdown{display:grid;gap:12px;margin:22px 0;text-align:left}
.breakdown .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.breakdown .row .progress{grid-column:1 / 3}
footer{margin-top:40px;font-size:14px;color:var(--muted)}
@media (max-width:560px){
  .levels{grid-template-columns:1fr}
  .level{min-height:0;flex-direction:row;align-items:center;gap:16px}
  .level .big{font-size:44px;min-width:76px}
  .vf{grid-template-columns:1fr 1fr}
  .prompt{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.sect{font-size:20px;margin:28px 0 -2px}
.chapbox{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.chapbox .chap{width:100%}
.coursbtn{font-size:16px;padding:8px 4px 4px 2px}
.chap.timer .num{background:var(--accent-soft);color:var(--accent);font-size:26px}
.clock{font-weight:700;font-variant-numeric:tabular-nums}
.fig .gl{stroke:var(--line);stroke-width:1}
.fig .pg{fill:var(--accent-soft);fill-opacity:.8;stroke:var(--ink);stroke-width:2}
.fig .vc{stroke:var(--accent);stroke-width:3;fill:none}
.fig .ahd{fill:var(--accent)}
.fig .pt{fill:var(--ink)}
.recap{margin-top:14px;padding:20px 18px}
.recap h3{font-size:22px;margin:24px 0 8px}
.recap h3:first-child{margin-top:0}
.recap p{margin:8px 0}
.recap sup{font-size:.7em;line-height:0}
.recap .def{border-left:5px solid var(--hl);background:var(--paper);padding:8px 14px;border-radius:0 10px 10px 0}
.recap .tb{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:16px;margin:8px 0}
.recap .tb th,.recap .tb td{border:1px solid var(--line);padding:4px 8px;text-align:center;font-variant-numeric:tabular-nums}
.recap .tb th{text-align:left;background:var(--accent-soft);white-space:nowrap}
.ticket{margin:18px auto 14px;max-width:420px;padding:18px 16px;border:2px dashed var(--ink);border-radius:16px;background:var(--hl);color:var(--hl-ink);text-align:center}
.ticket .t1{font-family:var(--display);font-weight:800;font-size:22px}
.ticket .t2{font-size:15px;margin-top:2px;opacity:.85}
.ticket .big-score small{color:inherit;opacity:.7}
.ticket .t3{font-weight:700;margin-top:4px}
.field.who{max-width:420px;margin:0 auto}
.note{margin:12px 0 0;padding:10px 14px;border-left:5px solid var(--hl);background:var(--surface);border-radius:0 10px 10px 0;font-size:16px}
.namebox{max-width:none;margin:18px 0 0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .18em;font-size:.95em}
.fr>span{padding:0 .25em}
.fr>span:first-child{border-bottom:1.6px solid currentColor}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="brand" aria-label="Retour à l’accueil">Révision <mark>DS</mark></button>
    <nav class="crumbs" id="crumbs" aria-label="Fil d’Ariane"></nav>
  </header>
  <main id="app"></main>
  
</div>

var BANK5 = [

{ch:3,k:'Cours',t:'qcm',q:'Le <b>carré</b> d’un nombre <i>a</i> est…',c:['le produit de <i>a</i> par lui-même','le produit de <i>a</i> par 2','le double de <i>a</i>','la somme de <i>a</i> et de lui-même'],a:0,e:'Définition du cours : <i>a</i><sup>2</sup> = <i>a</i> × <i>a</i>. Par exemple 5<sup>2</sup> = 5 × 5 = 25.'},
{ch:3,k:'Cours',t:'qcm',q:'Le <b>cube</b> d’un nombre <i>a</i> est…',c:['le produit de <i>a</i> par lui-même trois fois','le produit de <i>a</i> par 3','le triple de <i>a</i>','le produit de <i>a</i> par lui-même'],a:0,e:'Définition du cours : <i>a</i><sup>3</sup> = <i>a</i> × <i>a</i> × <i>a</i>. Par exemple 2<sup>3</sup> = 2 × 2 × 2 = 8.'},
{ch:3,k:'Cours',t:'vf',q:'<i>a</i><sup>2</sup> = <i>a</i> × 2',a:false,e:'Faux. <i>a</i><sup>2</sup> = <i>a</i> × <i>a</i>. Par exemple 5<sup>2</sup> = 25, alors que 5 × 2 = 10.'},
{ch:3,k:'Cours',t:'vf',q:'2<sup>3</sup> = 2 × 3',a:false,e:'Faux. 2<sup>3</sup> = 2 × 2 × 2 = 8, alors que 2 × 3 = 6.'},
{ch:3,k:'Cours',t:'qcm',q:'<i>a</i><sup>2</sup> correspond à…',c:['l’aire d’un carré de côté <i>a</i>','le volume d’un cube d’arête <i>a</i>','le périmètre d’un carré de côté <i>a</i>','la longueur de la diagonale d’un carré de côté <i>a</i>'],a:0,e:'Lien avec la géométrie : <i>a</i><sup>2</sup> est l’aire d’un carré de côté <i>a</i>.'},
{ch:3,k:'Cours',t:'qcm',q:'<i>a</i><sup>3</sup> correspond à…',c:['le volume d’un cube d’arête <i>a</i>','l’aire d’un carré de côté <i>a</i>','l’aire d’un cube d’arête <i>a</i>','le périmètre d’un carré de côté <i>a</i>'],a:0,e:'Lien avec la géométrie : <i>a</i><sup>3</sup> est le volume d’un cube d’arête <i>a</i>.'},
{ch:3,k:'Cours',t:'qcm',q:'Qu’appelle-t-on un <b>carré parfait</b> ?',c:['un nombre qui est le carré d’un entier','un nombre pair','un nombre qui est le cube d’un entier','un nombre qui est le double d’un entier'],a:0,e:'Un carré parfait est le carré d’un entier : 36 = 6<sup>2</sup> est un carré parfait. (27 = 3<sup>3</sup> est un cube parfait.)'},
// Calculs de carrés et de cubes (12)
{ch:3,k:'Calcul',t:'num',q:'Calcule 6<sup>2</sup>.',a:36,calc:'6**2',e:'6<sup>2</sup> = 6 × 6 = 36.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule 9<sup>2</sup>.',a:81,calc:'9**2',e:'9<sup>2</sup> = 9 × 9 = 81.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule 12<sup>2</sup>.',a:144,calc:'12**2',e:'12<sup>2</sup> = 12 × 12 = 144 (à connaître par cœur : table des carrés jusqu’à 12).'},
{ch:3,k:'Calcul',t:'num',q:'Calcule 7<sup>2</sup>.',a:49,calc:'7**2',e:'7<sup>2</sup> = 7 × 7 = 49.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule 11<sup>2</sup>.',a:121,calc:'11**2',e:'11<sup>2</sup> = 11 × 11 = 121.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule 8<sup>2</sup>.',a:64,calc:'8**2',e:'8<sup>2</sup> = 8 × 8 = 64.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule 10<sup>2</sup>.',a:100,calc:'10**2',e:'10<sup>2</sup> = 10 × 10 = 100.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule 2<sup>3</sup>.',a:8,calc:'2**3',e:'2<sup>3</sup> = 2 × 2 × 2 = 8. Attention : ce n’est pas 2 × 3.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule 3<sup>3</sup>.',a:27,calc:'3**3',e:'3<sup>3</sup> = 3 × 3 × 3 = 27.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule 4<sup>3</sup>.',a:64,calc:'4**3',e:'4<sup>3</sup> = 4 × 4 × 4 = 64.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule 5<sup>3</sup>.',a:125,calc:'5**3',e:'5<sup>3</sup> = 5 × 5 × 5 = 125.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule 10<sup>3</sup>.',a:1000,calc:'10**3',e:'10<sup>3</sup> = 10 × 10 × 10 = 1 000.'},
// Écrire sous la forme d'une puissance (7)
{ch:3,k:'Calcul',t:'pow',q:'Écris 36 sous la forme d’un <b>carré</b>.',a:'6^2',show:'6<sup>2</sup>',e:'36 = 6 × 6 = 6<sup>2</sup> (36 est un carré parfait).'},
{ch:3,k:'Calcul',t:'pow',q:'Écris 27 sous la forme d’un <b>cube</b>.',a:'3^3',show:'3<sup>3</sup>',e:'27 = 3 × 3 × 3 = 3<sup>3</sup> (27 est un cube parfait).'},
{ch:3,k:'Calcul',t:'pow',q:'Écris 144 sous la forme d’un <b>carré</b>.',a:'12^2',show:'12<sup>2</sup>',e:'D’après la table des carrés, 144 = 12 × 12 = 12<sup>2</sup>.'},
{ch:3,k:'Calcul',t:'pow',q:'Écris 125 sous la forme d’un <b>cube</b>.',a:'5^3',show:'5<sup>3</sup>',e:'125 = 5 × 5 × 5 = 5<sup>3</sup>.'},
{ch:3,k:'Calcul',t:'pow',q:'Écris 81 sous la forme d’un <b>carré</b>.',a:'9^2',show:'9<sup>2</sup>',e:'D’après la table des carrés, 81 = 9 × 9 = 9<sup>2</sup>.'},
{ch:3,k:'Calcul',t:'pow',q:'Écris 64 sous la forme d’un <b>carré</b>.',a:'8^2',show:'8<sup>2</sup>',e:'64 = 8 × 8 = 8<sup>2</sup>. (Et aussi 64 = 4 × 4 × 4 = 4<sup>3</sup>.)'},
{ch:3,k:'Calcul',t:'pow',q:'Écris 64 sous la forme d’un <b>cube</b>.',a:'4^3',show:'4<sup>3</sup>',e:'64 = 4 × 4 × 4 = 4<sup>3</sup>. (Et aussi 64 = 8<sup>2</sup>.)'},
// Priorités opératoires (6)
{ch:3,k:'Calcul',t:'qcm',q:'Dans une expression <b>sans parenthèse</b>, dans quel ordre effectue-t-on les calculs ?',c:['les puissances, puis les × et ÷, puis les + et −','les × et ÷, puis les puissances, puis les + et −','les + et −, puis les puissances, puis les × et ÷','de gauche à droite, sans règle particulière'],a:0,e:'Règle du cours : 1) les puissances ; 2) les multiplications et divisions, de gauche à droite ; 3) les additions et soustractions, de gauche à droite.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule <i>A</i> = 3 + 2<sup>2</sup> × 5.',a:23,calc:'3+2**2*5',e:'<i>A</i> = 3 + 4 × 5 = 3 + 20 = 23.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule <i>B</i> = 5<sup>2</sup> − 3 × 4.',a:13,calc:'5**2-3*4',e:'<i>B</i> = 25 − 12 = 13.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule <i>C</i> = (7 − 4)<sup>2</sup> + 1.',a:10,calc:'(7-4)**2+1',e:'On commence par la parenthèse : <i>C</i> = 3<sup>2</sup> + 1 = 9 + 1 = 10.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule <i>D</i> = 4 × 3<sup>2</sup> − 2<sup>3</sup>.',a:28,calc:'4*3**2-2**3',e:'<i>D</i> = 4 × 9 − 8 = 36 − 8 = 28.'},
{ch:3,k:'Calcul',t:'num',q:'Calcule <i>E</i> = 50 − 4<sup>2</sup> × 3.',a:2,calc:'50-4**2*3',e:'<i>E</i> = 50 − 16 × 3 = 50 − 48 = 2.'},
// Problèmes (2)
{ch:3,k:'Problème',t:'num',q:'Un carré a un côté de 9 cm. Quelle est son aire, en cm<sup>2</sup> ?',unit:'cm²',a:81,calc:'9**2',e:'L’aire d’un carré de côté <i>a</i> est <i>a</i><sup>2</sup> : 9<sup>2</sup> = 81 cm<sup>2</sup>.'},
{ch:3,k:'Problème',t:'num',q:'Un cube a une arête de 5 cm. Quel est son volume, en cm<sup>3</sup> ?',unit:'cm³',a:125,calc:'5**3',e:'Le volume d’un cube d’arête <i>a</i> est <i>a</i><sup>3</sup> : 5<sup>3</sup> = 125 cm<sup>3</sup>.'},

/* ============ CHAPITRE 4 — ANGLES (33) ============ */
// Cours (10)
{ch:4,k:'Cours',t:'qcm',q:'Deux angles sont <b>correspondants</b> lorsque…',c:['ils n’ont pas le même sommet, sont du même côté de la sécante, et l’un est entre (<i>d</i>) et (<i>d′</i>) alors que l’autre est à l’extérieur','ils ont le même sommet et sont opposés par le sommet','ils sont de part et d’autre de la sécante et tous les deux entre (<i>d</i>) et (<i>d′</i>)','leur somme vaut 180°'],a:0,e:'Définition du cours : pas le même sommet, du même côté de la sécante, l’un entre (<i>d</i>) et (<i>d′</i>), l’autre à l’extérieur.'},
{ch:4,k:'Cours',t:'qcm',q:'Deux angles sont <b>alternes-internes</b> lorsque…',c:['ils n’ont pas le même sommet, sont de part et d’autre de la sécante, et sont tous les deux entre (<i>d</i>) et (<i>d′</i>)','ils n’ont pas le même sommet, sont du même côté de la sécante, l’un entre (<i>d</i>) et (<i>d′</i>) et l’autre à l’extérieur','ils ont le même sommet','ils sont tous les deux à l’extérieur de la bande délimitée par (<i>d</i>) et (<i>d′</i>)'],a:0,e:'Définition du cours : alternes (de part et d’autre de la sécante) et internes (entre les deux droites).'},
{ch:4,k:'Cours',t:'num',q:'Avec deux droites et une sécante, combien y a-t-il de couples d’angles <b>correspondants</b> ?',a:4,calc:'4',e:'Remarque du cours : il existe quatre couples d’angles correspondants.'},
{ch:4,k:'Cours',t:'num',q:'Avec deux droites et une sécante, combien y a-t-il de couples d’angles <b>alternes-internes</b> ?',a:2,calc:'2',e:'Il y a deux couples d’angles alternes-internes.'},
{ch:4,k:'Cours',t:'qcm',q:'<b>Propriété directe.</b> Si deux droites sont parallèles et coupées par une sécante, alors les angles alternes-internes sont…',c:['de même mesure','supplémentaires (leur somme vaut 180°)','complémentaires (leur somme vaut 90°)','toujours droits'],a:0,e:'Propriété directe : deux droites parallèles coupées par une sécante forment des angles alternes-internes de même mesure.'},
{ch:4,k:'Cours',t:'qcm',q:'<b>Propriété directe.</b> Si deux droites sont parallèles et coupées par une sécante, alors les angles correspondants sont…',c:['de même mesure','supplémentaires (leur somme vaut 180°)','complémentaires (leur somme vaut 90°)','toujours droits'],a:0,e:'Propriété directe : deux droites parallèles coupées par une sécante forment aussi des angles correspondants de même mesure.'},
{ch:4,k:'Cours',t:'qcm',q:'<b>Propriété réciproque.</b> Si deux droites sont coupées par une sécante et forment des angles alternes-internes de même mesure, alors…',c:['ces deux droites sont parallèles','ces deux droites sont perpendiculaires','ces deux droites sont confondues','chacun de ces angles mesure 90°'],a:0,e:'Propriété réciproque : des angles alternes-internes (ou correspondants) de même mesure permettent de conclure que les droites sont parallèles.'},
{ch:4,k:'Cours',t:'num',q:'Quelle est la somme des mesures des angles d’un triangle, en degrés ?',unit:'°',a:180,calc:'180',e:'Théorème du cours : la somme des mesures des angles d’un triangle vaut 180°.'},
{ch:4,k:'Cours',t:'num',q:'Dans un triangle <b>équilatéral</b>, combien mesure chaque angle, en degrés ?',unit:'°',a:60,calc:'180/3',e:'Les trois angles sont égaux et leur somme vaut 180°, donc chacun mesure 180 : 3 = 60°.'},
{ch:4,k:'Cours',t:'qcm',q:'Dans un triangle <b>isocèle</b>, les deux angles à la base sont…',c:['égaux','complémentaires','droits','égaux à 60°'],a:0,e:'Dans un triangle isocèle, les deux angles à la base sont égaux.'},
// Reconnaître les angles sur la figure (7)
{ch:4,k:'Figure',t:'qcm',fig:'gen',hi:[1,5],q:'Sur la figure, quel angle est <b>correspondant</b> à l’angle 1 ?',c:['l’angle 3','l’angle 5','l’angle 6','l’angle 8'],a:1,e:'Les angles 1 et 5 n’ont pas le même sommet, sont du même côté de la sécante, et l’un est entre les droites alors que l’autre est à l’extérieur.'},
{ch:4,k:'Figure',t:'qcm',fig:'gen',hi:[4,8],q:'Sur la figure, quel angle est <b>correspondant</b> à l’angle 4 ?',c:['l’angle 2','l’angle 6','l’angle 7','l’angle 8'],a:3,e:'Les angles 4 et 8 sont du même côté de la sécante : l’angle 4 est entre les droites et l’angle 8 est à l’extérieur.'},
{ch:4,k:'Figure',t:'qcm',fig:'gen',hi:[3,5],q:'Sur la figure, quel angle est <b>alterne-interne</b> à l’angle 3 ?',c:['l’angle 4','l’angle 5','l’angle 6','l’angle 7'],a:1,e:'Les angles 3 et 5 sont tous les deux entre les droites et de part et d’autre de la sécante.'},
{ch:4,k:'Figure',t:'qcm',fig:'gen',hi:[4,6],q:'Sur la figure, quel angle est <b>alterne-interne</b> à l’angle 4 ?',c:['l’angle 5','l’angle 6','l’angle 7','l’angle 8'],a:1,e:'Les angles 4 et 6 sont tous les deux entre les droites et de part et d’autre de la sécante.'},
{ch:4,k:'Figure',t:'qcm',fig:'gen',hi:[4,6],q:'Sur la figure, quel angle est <b>alterne-interne</b> à l’angle 6 ?',c:['l’angle 3','l’angle 4','l’angle 5','l’angle 8'],a:1,e:'Le second couple d’angles alternes-internes est formé des angles 4 et 6 (le premier : 3 et 5).'},
{ch:4,k:'Figure',t:'vf',fig:'gen',hi:[3,5],q:'Les angles 3 et 5 sont alternes-internes.',a:true,e:'Vrai : ils sont entre les droites et de part et d’autre de la sécante.'},
{ch:4,k:'Figure',t:'vf',fig:'gen',hi:[4,5],q:'Les angles 4 et 5 sont alternes-internes.',a:false,e:'Faux : ils sont tous les deux entre les droites, mais du <b>même</b> côté de la sécante. Pour être alternes-internes, il faut qu’ils soient de part et d’autre.'},
// Mesures avec des droites parallèles (7)
{ch:4,k:'Figure',t:'num',fig:'par',hi:[1,5],unit:'°',q:'Les droites (<i>d</i>) et (<i>d′</i>) sont <b>parallèles</b>. L’angle 1 mesure 65°. Combien mesure l’angle 5 ?',a:65,calc:'65',e:'Les angles 1 et 5 sont correspondants. Les droites sont parallèles, donc ils sont de même mesure : 65°.'},
{ch:4,k:'Figure',t:'num',fig:'par',hi:[3,5],unit:'°',q:'Les droites (<i>d</i>) et (<i>d′</i>) sont <b>parallèles</b>. L’angle 3 mesure 110°. Combien mesure l’angle 5 ?',a:110,calc:'110',e:'Les angles 3 et 5 sont alternes-internes. Les droites sont parallèles, donc ils sont de même mesure : 110°.'},
{ch:4,k:'Figure',t:'num',fig:'par',hi:[4,6],unit:'°',q:'Les droites (<i>d</i>) et (<i>d′</i>) sont <b>parallèles</b>. L’angle 4 mesure 70°. Combien mesure l’angle 6 ?',a:70,calc:'70',e:'Les angles 4 et 6 sont alternes-internes. Les droites sont parallèles, donc ils sont de même mesure : 70°.'},
{ch:4,k:'Figure',t:'num',fig:'par',hi:[2,6],unit:'°',q:'Les droites (<i>d</i>) et (<i>d′</i>) sont <b>parallèles</b>. L’angle 2 mesure 115°. Combien mesure l’angle 6 ?',a:115,calc:'115',e:'Les angles 2 et 6 sont correspondants. Les droites sont parallèles, donc ils sont de même mesure : 115°.'},
{ch:4,k:'Figure',t:'num',fig:'par',hi:[4,8],unit:'°',q:'Les droites (<i>d</i>) et (<i>d′</i>) sont <b>parallèles</b>. L’angle 8 mesure 48°. Combien mesure l’angle 4 ?',a:48,calc:'48',e:'Les angles 4 et 8 sont correspondants. Les droites sont parallèles, donc ils sont de même mesure : 48°.'},
{ch:4,k:'Figure',t:'num',fig:'par',hi:[3,7],unit:'°',q:'Les droites (<i>d</i>) et (<i>d′</i>) sont <b>parallèles</b>. L’angle 7 mesure 125°. Combien mesure l’angle 3 ?',a:125,calc:'125',e:'Les angles 3 et 7 sont correspondants. Les droites sont parallèles, donc ils sont de même mesure : 125°.'},
{ch:4,k:'Cours',t:'qcm',fig:'par',hi:[1,5],q:'Les droites (<i>d</i>) et (<i>d′</i>) sont parallèles et l’angle 1 mesure 70°. Pour justifier que l’angle 5 mesure aussi 70°, quelle phrase utilise-t-on ?',c:['Si deux droites parallèles sont coupées par une sécante, alors les angles correspondants sont de même mesure.','Si deux droites sont coupées par une sécante et forment des angles correspondants de même mesure, alors elles sont parallèles.','La somme des mesures des angles d’un triangle vaut 180°.','Si deux angles ont la même mesure, alors ils ont le même sommet.'],a:0,e:'On part du fait que les droites sont parallèles pour en déduire que les angles sont égaux : c’est la propriété <b>directe</b>.'},
// Propriété réciproque (4)
{ch:4,k:'Cours',t:'qcm',fig:'gen',hi:[1,5],q:'Les angles correspondants 1 et 5 mesurent tous les deux 72°. Que peut-on dire des droites (<i>d</i>) et (<i>d′</i>) ?',c:['Elles sont parallèles.','Elles sont perpendiculaires.','On ne peut rien dire.','Elles sont confondues.'],a:0,e:'Propriété réciproque : deux droites coupées par une sécante qui forment des angles correspondants de même mesure sont parallèles.'},
{ch:4,k:'Cours',t:'qcm',fig:'gen',hi:[4,6],q:'Les angles alternes-internes 4 et 6 mesurent tous les deux 118°. Que peut-on dire des droites (<i>d</i>) et (<i>d′</i>) ?',c:['Elles sont parallèles.','Elles sont perpendiculaires.','Elles ne sont pas parallèles.','On ne peut rien dire.'],a:0,e:'Propriété réciproque : des angles alternes-internes de même mesure permettent de conclure que les droites sont parallèles.'},
{ch:4,k:'Cours',t:'qcm',fig:'gen',hi:[1,5],q:'Les angles correspondants 1 et 5 mesurent 70° et 75°. Que peut-on dire des droites (<i>d</i>) et (<i>d′</i>) ?',c:['Elles ne sont pas parallèles, car les angles correspondants n’ont pas la même mesure.','Elles sont parallèles.','Elles sont perpendiculaires.','On ne peut rien dire.'],a:0,e:'Si les droites étaient parallèles, les angles correspondants auraient la même mesure. Ici 70° ≠ 75° : elles ne sont pas parallèles.'},
{ch:4,k:'Cours',t:'qcm',fig:'gen',hi:[1,5],q:'Pour démontrer que (<i>d</i>) et (<i>d′</i>) sont parallèles, on sait que deux angles correspondants marqués sont de même mesure. Quelle phrase écrit-on après « D’après l’énoncé… » ?',c:['Or, si deux droites sont coupées par une sécante et forment des angles correspondants de même mesure, alors ces deux droites sont parallèles.','Or, si deux droites parallèles sont coupées par une sécante, alors les angles correspondants sont de même mesure.','Or, la somme des mesures des angles d’un triangle vaut 180°.','Or, deux droites parallèles ne se coupent jamais.'],a:0,e:'Pour démontrer un parallélisme à partir d’angles égaux, on utilise la propriété <b>réciproque</b> (angles égaux ⇒ droites parallèles).'},
// Triangles (5)
{ch:4,k:'Calcul',t:'num',unit:'°',q:'Dans le triangle <i>ABC</i>, <span class="hat">ABC</span> = 67° et <span class="hat">BAC</span> = 48°. Calcule <span class="hat">BCA</span>.',a:65,calc:'180-67-48',e:'La somme des angles d’un triangle vaut 180°, donc <span class="hat">BCA</span> = 180 − 67 − 48 = 65°.'},
{ch:4,k:'Calcul',t:'num',unit:'°',q:'Dans le triangle <i>EFG</i>, <span class="hat">FEG</span> = 58° et <span class="hat">EFG</span> = 64°. Calcule <span class="hat">EGF</span>.',a:58,calc:'180-58-64',e:'La somme des angles d’un triangle vaut 180°, donc <span class="hat">EGF</span> = 180 − 58 − 64 = 58°.'},
{ch:4,k:'Calcul',t:'num',unit:'°',q:'Dans le triangle <i>MNP</i>, <span class="hat">NMP</span> = 36° et <span class="hat">MNP</span> = 72°. Calcule <span class="hat">MPN</span>.',a:72,calc:'180-36-72',e:'<span class="hat">MPN</span> = 180 − 36 − 72 = 72°.'},
{ch:4,k:'Cours',t:'qcm',q:'Un triangle <i>MNP</i> a trois angles : <span class="hat">NMP</span> = 36°, <span class="hat">MNP</span> = 72° et <span class="hat">MPN</span> = 72°. Ce triangle est…',c:['isocèle en <i>M</i>','isocèle en <i>N</i>','isocèle en <i>P</i>','équilatéral'],a:0,e:'Les angles en <i>N</i> et en <i>P</i> sont égaux (72°) : ce sont les angles à la base, donc le triangle est isocèle en <i>M</i>.'},
{ch:4,k:'Calcul',t:'num',unit:'°',q:'Le triangle <i>EFG</i> est isocèle en <i>E</i> et <span class="hat">EFG</span> = 55°. Calcule <span class="hat">FEG</span>.',a:70,calc:'180-55-55',e:'Les angles à la base sont égaux : <span class="hat">EGF</span> = <span class="hat">EFG</span> = 55°. Donc <span class="hat">FEG</span> = 180 − 55 − 55 = 70°.'},

/* ============ CHAPITRE 5 — CALCUL LITTÉRAL (1) (33) ============ */
// Vocabulaire (6)
{ch:5,k:'Cours',t:'qcm',q:'Une <b>expression littérale</b> est…',c:['une expression contenant des lettres qui désignent des nombres inconnus ou variables','une expression qui ne contient que des nombres','une égalité entre deux nombres','un calcul dont le résultat est toujours positif'],a:0,e:'Définition du cours : une expression littérale contient des lettres qui désignent des nombres inconnus ou variables. Exemple : l’aire d’un rectangle s’écrit <i>L</i> × <i>l</i>.'},
{ch:5,k:'Cours',t:'qcm',q:'Quand peut-on masquer le signe × ?',c:['entre un nombre et une lettre, à condition d’écrire le nombre devant la lettre','entre deux nombres','entre une lettre et un nombre, avec la lettre écrite devant','jamais'],a:0,e:'Règle du cours : le signe × peut être masqué entre un nombre et une lettre (nombre devant), entre deux lettres, et devant une parenthèse.'},
{ch:5,k:'Cours',t:'qcm',q:'Une <b>conjecture</b> est…',c:['une affirmation que l’on pense vraie mais que l’on n’a pas encore démontrée','une affirmation démontrée dans tous les cas','un exemple qui prouve qu’une affirmation est fausse','un calcul qui contient une lettre'],a:0,e:'Vocabulaire du cours : une conjecture est une affirmation que l’on pense vraie, mais pas encore démontrée.'},
{ch:5,k:'Cours',t:'qcm',q:'Un <b>contre-exemple</b> est…',c:['un exemple particulier qui montre qu’une affirmation est fausse','un exemple qui prouve qu’une affirmation est toujours vraie','un calcul dont le résultat est 0','une valeur interdite pour la lettre'],a:0,e:'Vocabulaire du cours : un contre-exemple est un exemple particulier qui montre qu’une affirmation est fausse.'},
{ch:5,k:'Cours',t:'vf',q:'Un seul contre-exemple suffit pour montrer qu’une égalité n’est pas toujours vraie.',a:true,e:'Vrai. Pour rejeter une affirmation, il suffit de trouver un seul exemple pour lequel elle est fausse.'},
{ch:5,k:'Cours',t:'vf',q:'Si une égalité est vraie pour plusieurs valeurs testées, alors elle est démontrée.',a:false,e:'Faux. On peut seulement conjecturer qu’elle est vraie : pour la valider, il faut la démontrer dans tous les cas.'},
// Mettre en expression (5)
{ch:5,k:'Calcul',t:'expr',q:'Écris le <b>double</b> d’un nombre <i>x</i>.',a:'2x',show:'2<i>x</i>',e:'Le double de <i>x</i> s’écrit 2<i>x</i>.'},
{ch:5,k:'Calcul',t:'expr',q:'Écris le <b>triple</b> d’un nombre <i>x</i>.',a:'3x',show:'3<i>x</i>',e:'Le triple de <i>x</i> s’écrit 3<i>x</i>.'},
{ch:5,k:'Calcul',t:'expr',q:'Écris le <b>successeur</b> (le nombre suivant) d’un nombre <i>x</i>.',a:'x+1',show:'<i>x</i> + 1',e:'Le successeur de <i>x</i> s’écrit <i>x</i> + 1.'},
{ch:5,k:'Calcul',t:'expr',q:'Écris le <b>périmètre</b> d’un carré de côté <i>c</i>.',a:'4c',show:'4 × <i>c</i> (ou 4<i>c</i>)',e:'Le périmètre d’un carré de côté <i>c</i> s’écrit 4 × <i>c</i>, soit 4<i>c</i>.'},
{ch:5,k:'Calcul',t:'expr',q:'Écris l’<b>aire</b> d’un carré de côté <i>c</i>.',a:'c^2',show:'<i>c</i><sup>2</sup>',e:'L’aire d’un carré de côté <i>c</i> s’écrit <i>c</i><sup>2</sup>.'},
// Programmes de calcul (3)
{ch:5,k:'Calcul',t:'num',q:'Programme : « Choisir un nombre. Le multiplier par 9. Ajouter 5. » Quel résultat obtient-on si on choisit 3 ?',a:32,calc:'3*9+5',e:'3 × 9 = 27 puis 27 + 5 = 32.'},
{ch:5,k:'Calcul',t:'expr',q:'Programme : « Choisir un nombre. Le multiplier par 9. Ajouter 5. » On choisit <i>x</i>. Écris l’expression littérale associée à ce programme.',a:'9x+5',show:'<i>x</i> × 9 + 5 (ou 9<i>x</i> + 5)',e:'On choisit <i>x</i>, on le multiplie par 9 : <i>x</i> × 9, puis on ajoute 5 : <i>x</i> × 9 + 5, soit 9<i>x</i> + 5.'},
{ch:5,k:'Calcul',t:'expr',paren:true,accept:['3(x+4)'],soft:['(x+4)3'],note:'Correct ! On écrit plutôt le nombre devant la parenthèse : 3(<i>x</i> + 4).',q:'Programme : « Choisir un nombre. Lui ajouter 4. Multiplier le résultat par 3. » On choisit <i>x</i>. Écris l’expression littérale associée.',a:'3(x+4)',show:'3(<i>x</i> + 4)',e:'On ajoute 4 : <i>x</i> + 4. Puis on multiplie <b>le résultat</b> par 3 : il faut une parenthèse, 3(<i>x</i> + 4).'},
// Simplifier l'écriture (6)
{ch:5,k:'Calcul',t:'expr',strict:true,q:'Simplifie l’écriture de <i>A</i> = 7 × <i>x</i>.',a:'7x',show:'7<i>x</i>',e:'Le signe × peut être masqué entre un nombre et une lettre : <i>A</i> = 7<i>x</i>.'},
{ch:5,k:'Calcul',t:'expr',strict:true,q:'Simplifie l’écriture de <i>B</i> = <i>y</i> × 4.',a:'4y',show:'4<i>y</i>',e:'Le nombre se place toujours devant la lettre : <i>B</i> = 4<i>y</i> (et non <i>y</i>4).'},
{ch:5,k:'Calcul',t:'expr',strict:true,q:'Simplifie l’écriture de <i>C</i> = <i>a</i> × <i>b</i> × 3.',a:'3ab',show:'3<i>ab</i>',e:'On masque les signes × et on place le nombre devant les lettres : <i>C</i> = 3<i>ab</i>.'},
{ch:5,k:'Calcul',t:'expr',strict:true,paren:true,accept:['6(x+1)'],q:'Simplifie l’écriture de <i>D</i> = 6 × (<i>x</i> + 1).',a:'6(x+1)',show:'6(<i>x</i> + 1)',e:'Le signe × peut être masqué devant une parenthèse : <i>D</i> = 6(<i>x</i> + 1).'},
{ch:5,k:'Cours',t:'qcm',q:'Parmi ces écritures, laquelle est la bonne pour <i>x</i> × 5 ?',c:['5<i>x</i>','<i>x</i>5','<i>x</i> + 5','55<i>x</i>'],a:0,e:'Quand on simplifie <i>x</i> × 5, on n’écrit pas <i>x</i>5 mais 5<i>x</i> : le nombre est toujours placé devant la lettre.'},
{ch:5,k:'Cours',t:'vf',q:'On peut écrire 5 × 2 sous la forme 52.',a:false,e:'Faux. Il s’agit de deux nombres : on ne peut pas masquer le signe × (52 est le nombre cinquante-deux).'},

{ch:5,k:'Calcul',t:'num',q:'Calcule la valeur de <i>E</i> = 2<i>x</i> + 1 pour <i>x</i> = 7.',a:15,calc:'2*7+1',e:'<i>E</i> = 2 × 7 + 1 = 14 + 1 = 15.'},

var BANK4 = (function(){
var Q = [];
function add(o){ Q.push(o); }
function pl(n,w){ return n>1 ? w+'x' : w; }
function dirTxt(dx,dy){
  var p = [];
  if(dx) p.push(Math.abs(dx)+' carreau'+(Math.abs(dx)>1?'x':'')+' vers la '+(dx>0?'droite':'gauche'));
  if(dy) p.push(Math.abs(dy)+' carreau'+(Math.abs(dy)>1?'x':'')+' vers '+(dy>0?'le haut':'le bas'));
  return p.join(' et ');
}

var SP = {
 S1:{W:16,H:9,E:[1,1],F:[5,3],poly:{A:[6,3],B:[8,6],C:[10,3]}},
 S2:{W:16,H:9,E:[10,2],F:[7,4],poly:{A:[7,6],B:[9,8],C:[11,6]}},
 S3:{W:16,H:9,E:[2,6],F:[7,4],poly:{A:[4,3],B:[6,6],C:[8,3]}},
 S4:{W:16,H:9,E:[8,8],F:[6,5],poly:{A:[7,4],B:[9,6],C:[11,4]}}
};
function vec(sp){ return [sp.F[0]-sp.E[0], sp.F[1]-sp.E[1]]; }
function gOf(sp,cands,hi){ return {W:sp.W,H:sp.H,E:sp.E,F:sp.F,poly:sp.poly,c:cands}; }
// vecteurs : droite/gauche, haut/bas (nombres)
function numDir(sp,which){
  var v = vec(sp), dx=v[0], dy=v[1];
  var base = '<i>E</i> à <i>F</i>';
  if(which==='x'){
    add({ch:6,k:'Figure',t:'num',fig:'tr',g:gOf(sp,{}),hi:[],q:'Sur la figure, pour aller de '+base+', de combien de carreaux se déplace-t-on <b>vers la '+(dx>0?'droite':'gauche')+'</b> ?',a:Math.abs(dx),calc:String(Math.abs(dx)),e:'On compte les carreaux entre <i>E</i> et <i>F</i> horizontalement : '+Math.abs(dx)+' carreaux vers la '+(dx>0?'droite':'gauche')+'.'});
  } else {
    add({ch:6,k:'Figure',t:'num',fig:'tr',g:gOf(sp,{}),hi:[],q:'Sur la figure, pour aller de '+base+', de combien de carreaux se déplace-t-on <b>vers '+(dy>0?'le haut':'le bas')+'</b> ?',a:Math.abs(dy),calc:String(Math.abs(dy)),e:'On compte les carreaux entre <i>E</i> et <i>F</i> verticalement : '+Math.abs(dy)+' carreaux vers '+(dy>0?'le haut':'le bas')+'.'});
  }
}
numDir(SP.S1,'x'); numDir(SP.S1,'y');
numDir(SP.S2,'x'); numDir(SP.S2,'y');
numDir(SP.S3,'x'); numDir(SP.S4,'y');
// image d'un point
function imgQ(sp,name,rot){
  var v = vec(sp), dx=v[0], dy=v[1], P = sp.poly[name];
  var list = [[P[0]+dx,P[1]+dy],[P[0]-dx,P[1]-dy],[P[0]+dx,P[1]-dy],[P[0]-dx,P[1]+dy]];
  var ord = []; for(var i=0;i<4;i++) ord.push(list[(i+4-rot)%4]);
  var L = ['P','Q','R','S'], cands = {};
  ord.forEach(function(pt,i){ cands[L[i]] = pt; });
  var a = rot % 4;
  add({ch:6,k:'Figure',t:'qcm',noshuffle:true,fig:'tr',g:gOf(sp,cands),hi:[L[a]],
    q:'Sur la figure, le point <i>'+name+'′</i> est l’image du point <i>'+name+'</i> par la translation de vecteur <i>EF</i>. Quel point est <i>'+name+'′</i> ?',
    c:['Le point P','Le point Q','Le point R','Le point S'],a:a,
    e:'Le vecteur <i>EF</i> correspond à un glissement de '+dirTxt(dx,dy)+'. Depuis <i>'+name+'</i>, on se décale de la même façon : on arrive au point <b>'+L[a]+'</b>.'});
}
imgQ(SP.S1,'B',0); imgQ(SP.S1,'A',2);
imgQ(SP.S2,'A',1); imgQ(SP.S2,'C',3);
imgQ(SP.S3,'B',2); imgQ(SP.S3,'C',0);
imgQ(SP.S4,'B',3); imgQ(SP.S4,'A',1);
// quel glissement
function dirQ(sp){
  var v = vec(sp), dx=v[0], dy=v[1];
  var opts = [[dx,dy],[-dx,dy],[dx,-dy],[dy,dx]];
  add({ch:6,k:'Figure',t:'qcm',fig:'tr',g:gOf(sp,{}),hi:[],q:'Sur la figure, quel glissement correspond à la translation qui transforme <i>E</i> en <i>F</i> ?',c:opts.map(function(o){return dirTxt(o[0],o[1]);}),a:0,e:'De <i>E</i> à <i>F</i>, on se déplace de '+dirTxt(dx,dy)+'. Chaque point de la figure glisse de la même façon.'});
}
dirQ(SP.S1); dirQ(SP.S2); dirQ(SP.S3); dirQ(SP.S4);

var COURS = {
ds2:{
3:'<h3>Carré et cube</h3>'+
'<p class="def"><i>a</i><sup>2</sup> = <i>a</i> × <i>a</i> (« <i>a</i> au carré ») et <i>a</i><sup>3</sup> = <i>a</i> × <i>a</i> × <i>a</i> (« <i>a</i> au cube »).</p>'+
'<p>Exemples : 5<sup>2</sup> = 5 × 5 = 25 ; 2<sup>3</sup> = 2 × 2 × 2 = 8.<br><b>Attention :</b> 5<sup>2</sup> n’est pas 5 × 2, et 2<sup>3</sup> n’est pas 2 × 3.</p>'+
'<p><i>a</i><sup>2</sup> est l’aire d’un carré de côté <i>a</i> ; <i>a</i><sup>3</sup> est le volume d’un cube d’arête <i>a</i>.</p>'+
'<h3>Carrés à connaître</h3>'+
'<table class="tb"><tr><th>Nombre</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td></tr><tr><th>Son carré</th><td>0</td><td>1</td><td>4</td><td>9</td><td>16</td><td>25</td><td>36</td><td>49</td><td>64</td><td>81</td><td>100</td><td>121</td><td>144</td></tr></table>'+
'<p>Cubes : 2<sup>3</sup> = 8 ; 3<sup>3</sup> = 27 ; 4<sup>3</sup> = 64 ; 5<sup>3</sup> = 125 ; 10<sup>3</sup> = 1 000.</p>'+
'<h3>Écrire sous la forme d’une puissance</h3>'+
'<p>36 = 6<sup>2</sup> ; 27 = 3<sup>3</sup> ; 64 = 8<sup>2</sup> = 4<sup>3</sup> ; 100 = 10<sup>2</sup> ; 81 = 9<sup>2</sup>.</p>'+
'<h3>Priorités opératoires</h3>'+
'<p class="def">On calcule d’abord les parenthèses, puis les <b>puissances</b>, puis les <b>multiplications et divisions</b>, enfin les <b>additions et soustractions</b> (de gauche à droite).</p>'+
'<p><i>A</i> = 3 + 2<sup>2</sup> × 5 = 3 + 4 × 5 = 3 + 20 = 23<br><i>B</i> = 5<sup>2</sup> − 3 × 4 = 25 − 12 = 13<br><i>C</i> = (7 − 4)<sup>2</sup> + 1 = 3<sup>2</sup> + 1 = 10<br><i>D</i> = 4 × 3<sup>2</sup> − 2<sup>3</sup> = 36 − 8 = 28</p>',
4:'<h3>Angles correspondants</h3>'+
'<p class="def">Deux angles sont <b>correspondants</b> s’ils : 1) n’ont pas le même sommet ; 2) sont du même côté de la sécante ; 3) l’un est entre (<i>d</i>) et (<i>d′</i>), l’autre à l’extérieur. Il y a 4 couples d’angles correspondants.</p>'+
'<h3>Angles alternes-internes</h3>'+
'<p class="def">Deux angles sont <b>alternes-internes</b> s’ils : 1) n’ont pas le même sommet ; 2) sont de part et d’autre de la sécante ; 3) sont tous les deux entre (<i>d</i>) et (<i>d′</i>). Il y a 2 couples d’angles alternes-internes.</p>'+
'<h3>Parallèles et angles</h3>'+
'<p class="def"><b>Propriété directe.</b> Si deux droites parallèles sont coupées par une sécante, alors les angles alternes-internes (ou correspondants) sont de même mesure.</p>'+
'<p class="def"><b>Propriété réciproque.</b> Si deux droites coupées par une sécante forment des angles alternes-internes (ou correspondants) de même mesure, alors ces deux droites sont parallèles.</p>'+
'<h3>Triangles</h3>'+
'<p class="def">La somme des mesures des angles d’un triangle est égale à <b>180°</b>.</p>'+
'<p>Triangle isocèle : les deux angles à la base sont égaux. Triangle équilatéral : les trois angles mesurent 60°.</p>',
5:'<h3>Expression littérale</h3>'+
'<p class="def">Une expression littérale contient des lettres qui désignent des nombres inconnus ou variables. Exemple : l’aire d’un rectangle s’écrit <i>L</i> × <i>l</i>.</p>'+
'<p>Formules à connaître : le double de <i>x</i> → 2<i>x</i> ; le triple → 3<i>x</i> ; le successeur → <i>x</i> + 1 ; périmètre d’un carré de côté <i>c</i> → 4 × <i>c</i> ; aire → <i>c</i><sup>2</sup>.</p>'+
'<h3>Simplifier l’écriture</h3>'+
'<p class="def">Le signe × peut être masqué entre un nombre et une lettre (le nombre devant), entre deux lettres, et devant une parenthèse : 3 × <i>x</i> = 3<i>x</i> ; 5 × (<i>x</i> + 2) = 5(<i>x</i> + 2).</p>'+
'<p><i>x</i> × 5 s’écrit 5<i>x</i> (pas <i>x</i>5) ; 5 × 2 ne s’écrit pas 52.</p>'+
'<h3>Valeur d’une expression</h3>'+
'<p>On remplace la lettre par la valeur proposée puis on calcule. Exemple : 2<i>x</i> + 1 pour <i>x</i> = 7 : 2 × 7 + 1 = 15.</p>'+
'<h3>Conjecture et contre-exemple</h3>'+
'<p class="def">Une <b>conjecture</b> est une affirmation que l’on pense vraie mais qui n’est pas démontrée. Un <b>contre-exemple</b> est un exemple qui montre qu’une affirmation est fausse : un seul suffit.</p>'+
'<p>Tester 2<i>x</i> + 3 = 2(<i>x</i> + 3) pour <i>x</i> = 4 : 11 ≠ 14, l’égalité est fausse.</p>'
},
ds3:{
5:'<h3>Expression littérale</h3>'+
'<p class="def">Une expression littérale est une expression contenant des lettres (variables) qui désignent des nombres inconnus.</p>'+
'<p>Programme de calcul : « Choisir un nombre, le multiplier par 9, ajouter 5 ». On choisit <i>x</i> : <i>x</i> × 9 + 5. Pour <i>x</i> = 3 : 3 × 9 + 5 = 32.</p>'+
'<h3>Simplifier l’écriture</h3>'+
'<p class="def">Le signe × peut être masqué : entre deux lettres différentes, entre un nombre et une lettre (nombre devant), devant une parenthèse.</p>'+
'<p><i>a</i> × <i>b</i> = <i>ab</i> ; 3 × <i>x</i> = 3<i>x</i> ; 5 × (<i>x</i> + 2) = 5(<i>x</i> + 2). On écrit 5<i>x</i> et non <i>x</i>5 ; on écrit <i>x</i> à la place de 1<i>x</i>. Et 5 × 2 ne s’écrit pas 52.</p>'+
'<p><i>a</i> × <i>a</i> = <i>a</i><sup>2</sup> et <i>a</i> × <i>a</i> × <i>a</i> = <i>a</i><sup>3</sup>. Attention : 5<sup>2</sup> = 25 (pas 5 × 2).</p>'+
'<h3>Réduire une expression</h3>'+
'<p class="def"><i>ax</i> + <i>bx</i> = (<i>a</i> + <i>b</i>)<i>x</i> et <i>ax</i> − <i>bx</i> = (<i>a</i> − <i>b</i>)<i>x</i>.</p>'+
'<p>Exemple : <i>A</i> = 2<i>x</i> + 3<i>x</i><sup>2</sup> − <i>x</i> + 8 − 6<i>x</i><sup>2</sup> − 13<br>= (3 − 6)<i>x</i><sup>2</sup> + (2 − 1)<i>x</i> + (8 − 13) = −3<i>x</i><sup>2</sup> + <i>x</i> − 5.<br>On ne regroupe que les termes « de la même famille » : les <i>x</i> avec les <i>x</i>, les <i>x</i><sup>2</sup> avec les <i>x</i><sup>2</sup>, les nombres entre eux.</p>'+
'<h3>Valeur d’une expression</h3>'+
'<p>On remplace la lettre par la valeur proposée et on calcule : 2<i>x</i> + 1 pour <i>x</i> = 7 donne 2 × 7 + 1 = 15.</p>'+
'<h3>Tester une égalité</h3>'+
'<p>2<i>x</i> + 1 = 5 + <i>x</i> pour <i>x</i> = 1 ? Gauche : 2 × 1 + 1 = 3. Droite : 5 + 1 = 6. Les deux membres ne sont pas égaux : l’égalité est fausse pour <i>x</i> = 1.</p>',
6:'<h3>Translation</h3>'+
'<p class="def">La translation qui transforme <i>E</i> en <i>F</i> (translation de vecteur <i>EF</i>) est le glissement selon la droite (<i>EF</i>), dans le sens de <i>E</i> vers <i>F</i>, d’une longueur égale à <i>EF</i>.</p>'+
'<h3>Construire une image</h3>'+
'<p>On lit le « glissement » sur le quadrillage (par exemple 10 carreaux vers la droite et 4 vers le haut depuis <i>E</i>), puis on repart de chaque sommet en reproduisant le même glissement. On relie ensuite les points obtenus.</p>'+
'<h3>Propriétés</h3>'+
'<p class="def">La translation conserve l’alignement des points, les longueurs, les aires et les mesures des angles.</p>'+
'<p>La figure image est exactement la même que la figure de départ : même taille, même aire.</p>'+
'<h3>Frises et pavages</h3>'+
'<p class="def">Une <b>frise</b> est un motif reproduit dans <b>une seule direction</b> par translation. Un <b>pavage</b> est un motif reproduit dans <b>deux directions</b> par des translations et qui recouvre parfaitement le plan (sans trou, sans superposition).</p>',
7:'<h3>Carré et racine carrée</h3>'+
'<p class="def">Le carré d’un nombre <i>a</i> est <i>a</i><sup>2</sup> = <i>a</i> × <i>a</i>.<br>La <b>racine carrée</b> d’un nombre positif <i>a</i> est le nombre <b>positif</b> dont le carré est égal à <i>a</i>. Elle se note √<i>a</i>.</p>'+
'<p>Exemples : √36 = 6 car 6<sup>2</sup> = 36 ; √11 est le nombre positif dont le carré est 11, il vaut environ 3,32.<br>On a √(<i>a</i><sup>2</sup>) = <i>a</i> lorsque <i>a</i> ⩾ 0.</p>'+
'<p><b>Remarque :</b> la racine carrée n’existe que pour les nombres positifs. √(−5) n’existe pas.</p>'+
'<h3>Carrés parfaits</h3>'+
'<p class="def">Un carré parfait est le carré d’un nombre entier positif.</p>'+

add({ch:4,k:'Cours',t:'qcm',q:'Si le point <i>M</i> appartient au segment [<i>AB</i>], alors…',c:['<i>AM</i> + <i>MB</i> = <i>AB</i>','<i>AM</i> + <i>MB</i> &gt; <i>AB</i>','<i>AM</i> = <i>MB</i>','<i>AM</i> × <i>MB</i> = <i>AB</i>'],a:0,e:'Propriété du cours : si <i>M</i> appartient à [<i>AB</i>], alors <i>AM</i> + <i>MB</i> = <i>AB</i>.'});
add({ch:4,k:'Cours',t:'qcm',q:'Si le point <i>N</i> n’appartient pas au segment [<i>AB</i>], alors…',c:['<i>AN</i> + <i>NB</i> &gt; <i>AB</i>','<i>AN</i> + <i>NB</i> = <i>AB</i>','<i>AN</i> + <i>NB</i> &lt; <i>AB</i>','<i>AN</i> = <i>NB</i>'],a:0,e:'Propriété du cours : si <i>N</i> n’appartient pas à [<i>AB</i>], alors <i>AN</i> + <i>NB</i> &gt; <i>AB</i> (passer par <i>N</i> allonge le chemin).'});
add({ch:4,k:'Cours',t:'qcm',q:'Si <i>AM</i> + <i>MB</i> = <i>AB</i>, alors…',c:['le point <i>M</i> appartient au segment [<i>AB</i>]','le point <i>M</i> est le milieu de [<i>AB</i>]','le point <i>M</i> n’appartient pas à [<i>AB</i>]','<i>M</i> est le centre d’un cercle passant par <i>A</i> et <i>B</i>'],a:0,e:'Propriété réciproque du cours : si <i>AM</i> + <i>MB</i> = <i>AB</i>, alors <i>M</i> appartient au segment [<i>AB</i>]. (Pas forcément au milieu.)'});
add({ch:4,k:'Calcul',t:'num',unit:'cm',q:'Le point <i>M</i> appartient au segment [<i>AB</i>]. On donne <i>AB</i> = 9 cm et <i>AM</i> = 4 cm. Calcule <i>MB</i>.',a:5,calc:'9-4',e:'<i>M</i> appartient à [<i>AB</i>] donc <i>AM</i> + <i>MB</i> = <i>AB</i>, d’où <i>MB</i> = 9 − 4 = 5 cm.'});
add({ch:4,k:'Calcul',t:'num',unit:'cm',q:'Le point <i>M</i> appartient au segment [<i>AB</i>]. On donne <i>AB</i> = 12 cm et <i>MB</i> = 5 cm. Calcule <i>AM</i>.',a:7,calc:'12-5',e:'<i>AM</i> + <i>MB</i> = <i>AB</i>, d’où <i>AM</i> = 12 − 5 = 7 cm.'});
add({ch:4,k:'Calcul',t:'num',unit:'cm',q:'Le point <i>M</i> appartient au segment [<i>AB</i>]. On donne <i>AB</i> = 15 cm et <i>AM</i> = 8,5 cm. Calcule <i>MB</i>.',a:6.5,calc:'15-8.5',e:'<i>MB</i> = <i>AB</i> − <i>AM</i> = 15 − 8,5 = 6,5 cm.'});
add({ch:4,k:'Calcul',t:'qcm',q:'On donne <i>AB</i> = 9 cm, <i>AM</i> = 4 cm et <i>MB</i> = 5 cm. Le point <i>M</i> appartient-il au segment [<i>AB</i>] ?',c:['Oui, car 4 + 5 = 9','Non, car 4 + 5 &gt; 9','Non, car 4 ≠ 5','On ne peut pas savoir'],a:0,e:'<i>AM</i> + <i>MB</i> = 4 + 5 = 9 = <i>AB</i>, donc <i>M</i> appartient à [<i>AB</i>].'});
add({ch:4,k:'Calcul',t:'qcm',q:'On donne <i>AB</i> = 9 cm, <i>AN</i> = 7 cm et <i>NB</i> = 6 cm. Le point <i>N</i> appartient-il au segment [<i>AB</i>] ?',c:['Non, car 7 + 6 = 13 &gt; 9','Oui, car 7 + 6 = 13','Oui, car 7 &gt; 6','On ne peut pas savoir'],a:0,e:'<i>AN</i> + <i>NB</i> = 7 + 6 = 13 et 13 &gt; 9 = <i>AB</i>, donc <i>N</i> n’appartient pas à [<i>AB</i>].'});
add({ch:4,k:'Calcul',t:'qcm',q:'On donne <i>AB</i> = 10 cm, <i>AP</i> = 6 cm et <i>PB</i> = 5 cm. Le point <i>P</i> appartient-il au segment [<i>AB</i>] ?',c:['Non, car 6 + 5 = 11 &gt; 10','Oui, car 6 + 5 = 11','Oui, car 6 &gt; 5','Non, car 6 + 5 &lt; 10'],a:0,e:'<i>AP</i> + <i>PB</i> = 6 + 5 = 11 ≠ 10 : <i>P</i> n’appartient pas à [<i>AB</i>].'});
add({ch:4,k:'Calcul',t:'qcm',q:'On donne <i>AB</i> = 8 cm, <i>AQ</i> = 3 cm et <i>QB</i> = 5 cm. Le point <i>Q</i> appartient-il au segment [<i>AB</i>] ?',c:['Oui, car 3 + 5 = 8','Non, car 3 ≠ 5','Non, car 3 + 5 &gt; 8','On ne peut pas savoir'],a:0,e:'<i>AQ</i> + <i>QB</i> = 3 + 5 = 8 = <i>AB</i>, donc <i>Q</i> appartient à [<i>AB</i>].'});
add({ch:4,k:'Calcul',t:'num',unit:'cm',q:'On donne <i>AN</i> = 7 cm et <i>NB</i> = 6 cm. Calcule <i>AN</i> + <i>NB</i>.',a:13,calc:'7+6',e:'<i>AN</i> + <i>NB</i> = 7 + 6 = 13 cm.'});
// Milieu
add({ch:4,k:'Cours',t:'qcm',q:'Le <b>milieu</b> d’un segment est…',c:['le point du segment situé à la même distance de chaque extrémité','un point quelconque du segment','le point situé à 0 cm d’une extrémité','le centre d’un cercle passant par une extrémité'],a:0,e:'Définition du cours : le milieu d’un segment est le point situé à la même distance de chaque extrémité du segment.'});
add({ch:4,k:'Cours',t:'qcm',q:'Léo affirme : « <i>I</i> est le milieu de [<i>MN</i>] car <i>MI</i> = 4 cm. » Que manque-t-il à son explication ?',c:['Il faut que <i>I</i> appartienne à [<i>MN</i>] et que <i>IN</i> = <i>MI</i>','Il faut que <i>MN</i> = 4 cm','Il faut que <i>I</i> soit le centre d’un cercle','Rien, son explication est suffisante'],a:0,e:'Le milieu <i>I</i> de [<i>MN</i>] est le point du segment [<i>MN</i>] tel que <i>MI</i> = <i>IN</i> : il faut les <b>deux</b> distances égales (<i>IN</i> = 4 cm aussi).'});
add({ch:4,k:'Calcul',t:'num',unit:'cm',q:'<i>I</i> est le milieu de [<i>MN</i>] et <i>MN</i> = 10 cm. Calcule <i>MI</i>.',a:5,calc:'10/2',e:'<i>MI</i> = <i>IN</i> et <i>MI</i> + <i>IN</i> = <i>MN</i> = 10, donc <i>MI</i> = 10 : 2 = 5 cm.'});
add({ch:4,k:'Calcul',t:'num',unit:'cm',q:'<i>I</i> est le milieu de [<i>AB</i>] et <i>AB</i> = 14 cm. Calcule <i>AI</i>.',a:7,calc:'14/2',e:'<i>I</i> est le milieu : <i>AI</i> = <i>AB</i> : 2 = 14 : 2 = 7 cm.'});
add({ch:4,k:'Calcul',t:'num',unit:'cm',q:'<i>I</i> est le milieu de [<i>AB</i>] et <i>AI</i> = 6 cm. Calcule <i>AB</i>.',a:12,calc:'6*2',e:'<i>AI</i> = <i>IB</i> = 6 cm, donc <i>AB</i> = 6 + 6 = 12 cm.'});
add({ch:4,k:'Calcul',t:'num',unit:'cm',q:'<i>I</i> est le milieu de [<i>MN</i>] et <i>IN</i> = 3,5 cm. Calcule <i>MN</i>.',a:7,calc:'3.5*2',e:'<i>MI</i> = <i>IN</i> = 3,5 cm, donc <i>MN</i> = 3,5 + 3,5 = 7 cm.'});
add({ch:4,k:'Cours',t:'vf',q:'Dire que <i>I</i> est équidistant de <i>M</i> et <i>N</i> signifie que <i>MI</i> = <i>IN</i>.',a:true,e:'Vrai. Vocabulaire du cours : on dit aussi que le point <i>I</i> est équidistant de <i>M</i> et <i>N</i>.'});
add({ch:4,k:'Cours',t:'vf',q:'Si <i>MI</i> = <i>IN</i>, alors <i>I</i> est forcément le milieu du segment [<i>MN</i>].',a:false,e:'Faux. Le milieu doit aussi appartenir au segment [<i>MN</i>]. Un point peut être à égale distance de <i>M</i> et de <i>N</i> sans être sur le segment.'});

add({ch:4,k:'Cours',t:'qcm',q:'Un <b>cercle</b> de centre <i>O</i> et de rayon <i>r</i> est…',c:['l’ensemble de tous les points situés à la même distance <i>r</i> du point <i>O</i>','l’ensemble de tous les points situés à une distance inférieure ou égale à <i>r</i> du point <i>O</i>','un segment qui passe par <i>O</i>','un point situé à <i>r</i> de <i>O</i>'],a:0,e:'Définition du cours : un cercle de centre <i>O</i> est formé par tous les points situés à la même distance <i>r</i> du point <i>O</i>.'});
add({ch:4,k:'Cours',t:'qcm',q:'Un <b>rayon</b> d’un cercle est…',c:['un segment qui relie un point du cercle au centre','un segment qui relie deux points du cercle','une corde qui passe par le centre','la longueur du tour du cercle'],a:0,e:'Définition du cours : un rayon est un segment qui relie un point du cercle au centre du cercle.'});
add({ch:4,k:'Cours',t:'qcm',q:'Une <b>corde</b> d’un cercle est…',c:['un segment qui relie deux points du cercle','un segment qui relie un point du cercle au centre','le double du rayon','un point du cercle'],a:0,e:'Définition du cours : une corde est un segment qui relie deux points du cercle.'});
add({ch:4,k:'Cours',t:'qcm',q:'Un <b>diamètre</b> d’un cercle est…',c:['une corde qui passe par le centre du cercle','un segment qui relie le centre à un point du cercle','une corde qui ne passe pas par le centre','la moitié du rayon'],a:0,e:'Définition du cours : un diamètre est une corde qui passe par le centre du cercle.'});

}
ciQ('[<i>AB</i>]',['A','B'],0,'[<i>AB</i>] relie deux points du cercle mais ne passe pas par le centre <i>O</i> : c’est une corde (qui n’est pas un diamètre).');

ciQ('[<i>OE</i>]',['E','O'],2,'[<i>OE</i>] relie le centre <i>O</i> à un point <i>E</i> du cercle : c’est un rayon.');
add({ch:4,k:'Calcul',t:'num',unit:'cm',q:'Un cercle a pour rayon 3 cm. Quelle est la longueur de son diamètre ?',a:6,calc:'2*3',e:'Propriété du cours : le diamètre est le double du rayon : 2 × 3 = 6 cm.'});
add({ch:4,k:'Calcul',t:'num',unit:'cm',q:'Un cercle a un diamètre de 14 cm. Quelle est la longueur de son rayon ?',a:7,calc:'14/2',e:'Le diamètre est le double du rayon : le rayon vaut 14 : 2 = 7 cm.'});
add({ch:4,k:'Cours',t:'vf',q:'La longueur d’un diamètre est supérieure ou égale à la longueur de n’importe quelle corde du même cercle.',a:true,e:'Vrai. Propriété du cours : la longueur d’un diamètre est supérieure ou égale à celle d’une corde.'});
add({ch:4,k:'Cours',t:'vf',q:'La longueur d’un diamètre est le triple de celle d’un rayon.',a:false,e:'Faux : le diamètre est le <b>double</b> du rayon.'});
add({ch:4,k:'Calcul',t:'qcm',q:'<i>O</i> est le centre d’un cercle de rayon 3 cm et <i>OE</i> = 2 cm. Le point <i>E</i> appartient-il au cercle ?',c:['Non, car <i>OE</i> ≠ 3 cm','Oui, car <i>OE</i> &lt; 3 cm','Oui, car <i>OE</i> = 2 cm','On ne peut pas savoir'],a:0,e:'Un point appartient au cercle si sa distance au centre est exactement égale au rayon. Ici <i>OE</i> = 2 cm ≠ 3 cm.'});
// Disque
add({ch:4,k:'Cours',t:'qcm',q:'Un <b>disque</b> de centre <i>O</i> et de rayon <i>r</i> est…',c:['l’ensemble des points situés à une distance inférieure ou égale à <i>r</i> du point <i>O</i>','l’ensemble des points situés à la même distance <i>r</i> du point <i>O</i>','un segment de longueur <i>r</i>','l’ensemble des points situés à une distance supérieure à <i>r</i>'],a:0,e:'Définition du cours : un disque est formé de tous les points situés à une distance inférieure ou égale à <i>r</i> du centre. (Le cercle, lui, n’est que le « bord ».)'});

add({ch:4,k:'Calcul',t:'qcm',q:'Cercle et disque de centre <i>O</i> et de rayon 3 cm. On a <i>OB</i> = 3 cm. Le point <i>B</i> appartient…',c:['au cercle et au disque','au disque mais pas au cercle','au cercle mais pas au disque','ni au cercle ni au disque'],a:0,e:'<i>OB</i> = 3 cm : <i>B</i> est sur le cercle, et comme 3 ⩽ 3, il est aussi dans le disque.'});
add({ch:4,k:'Calcul',t:'qcm',q:'Cercle et disque de centre <i>O</i> et de rayon 3 cm. On a <i>OC</i> = 5 cm. Le point <i>C</i> appartient…',c:['ni au cercle ni au disque','au disque mais pas au cercle','au cercle mais pas au disque','au cercle et au disque'],a:0,e:'<i>OC</i> = 5 cm &gt; 3 cm : <i>C</i> est à l’extérieur, donc il n’appartient ni au disque ni au cercle.'});
add({ch:4,k:'Cours',t:'vf',q:'Tout point du cercle appartient aussi au disque de même centre et de même rayon.',a:true,e:'Vrai : un point du cercle est à la distance exacte <i>r</i> du centre, et <i>r</i> ⩽ <i>r</i>.'});
add({ch:4,k:'Cours',t:'vf',q:'Tout point du disque appartient aussi au cercle de même centre et de même rayon.',a:false,e:'Faux : un point à l’intérieur du disque (distance &lt; <i>r</i>) n’est pas sur le cercle.'});
// Le sentier
var SN = {};
add({ch:4,k:'Problème',t:'num',unit:'cm',fig:'sn',g:SN,hi:[],q:'Sur une carte, un sentier est représenté par le segment [<i>AB</i>] de 12 cm. Les points <i>C</i>, <i>D</i> et <i>E</i> le partagent en 4 parties de même longueur (dans l’ordre <i>A</i>, <i>C</i>, <i>D</i>, <i>E</i>, <i>B</i>). Quelle est la longueur de chaque partie ?',a:3,calc:'12/4',e:'12 : 4 = 3 cm.'});
add({ch:4,k:'Problème',t:'frac',irr:true,fig:'sn',g:SN,hi:['D'],a:'1/2',q:'Même sentier ([<i>AB</i>] = 12 cm, 4 parties égales). Quelle fraction de [<i>AB</i>] représente [<i>AD</i>] ? (simplifie-la)',e:'[<i>AD</i>] contient 2 parties sur 4 : '+F(2,4)+' = '+F(1,2)+'.'});
add({ch:4,k:'Problème',t:'qcm',fig:'sn',g:SN,hi:['D'],q:'Même sentier. Pourquoi <i>D</i> est-il le milieu de [<i>AB</i>] ?',c:['Car <i>D</i> appartient à [<i>AB</i>] et <i>AD</i> = <i>DB</i> = 6 cm','Car <i>AD</i> = 3 cm','Car <i>D</i> est le point du milieu de la figure','Car <i>AD</i> + <i>DB</i> = 12 cm uniquement'],a:0,e:'<i>AD</i> = 2 × 3 = 6 cm et <i>DB</i> = 2 × 3 = 6 cm, avec <i>D</i> sur [<i>AB</i>] : <i>D</i> est à la même distance de <i>A</i> et de <i>B</i>, c’est le milieu.'});
add({ch:4,k:'Problème',t:'num',unit:'cm',fig:'sn',g:SN,hi:['E'],q:'Même sentier. Calcule la longueur <i>AE</i>.',a:9,calc:'3*3',e:'[<i>AE</i>] contient 3 parties de 3 cm : <i>AE</i> = 3 × 3 = 9 cm.'});
add({ch:4,k:'Problème',t:'frac',irr:true,fig:'sn',g:SN,hi:['E'],a:'3/4',q:'Même sentier. Quelle fraction de [<i>AB</i>] représente [<i>AE</i>] ?',e:'[<i>AE</i>] contient 3 parties sur 4 : '+F(3,4)+'. (Aussi : 9 cm sur 12 cm, '+F(9,12)+' = '+F(3,4)+'.)'});
add({ch:4,k:'Problème',t:'qcm',fig:'sn',g:SN,hi:['A','B'],q:'Même sentier. On considère le cercle de centre <i>D</i> et de rayon 6 cm. Que peut-on dire des points <i>A</i> et <i>B</i> et du segment [<i>AB</i>] ?',c:['<i>A</i> et <i>B</i> appartiennent au cercle et [<i>AB</i>] en est un diamètre','<i>A</i> et <i>B</i> n’appartiennent pas au cercle','[<i>AB</i>] est un rayon du cercle','<i>A</i> appartient au cercle mais pas <i>B</i>'],a:0,e:'<i>DA</i> = <i>DB</i> = 6 cm = le rayon : <i>A</i> et <i>B</i> sont sur le cercle. [<i>AB</i>] est une corde qui passe par le centre <i>D</i> : c’est un diamètre.'});
add({ch:4,k:'Problème',t:'qcm',fig:'sn',g:SN,hi:['E'],q:'Même sentier, cercle de centre <i>D</i> et de rayon 6 cm. On a <i>DE</i> = 3 cm. Le point <i>E</i> appartient…',c:['au disque mais pas au cercle','au cercle mais pas au disque','au cercle et au disque','ni au cercle ni au disque'],a:0,e:'<i>DE</i> = 3 cm ⩽ 6 cm : <i>E</i> est dans le disque ; <i>DE</i> ≠ 6 cm : il n’est pas sur le cercle.'});
return Q;
})();

function normNum(s){
  s = String(s).toLowerCase().replace(/[\s  ]/g,'').replace(/[−–—]/g,'-').replace(',','.');
  s = s.replace(/(°|%|cm[²³23]?|cm|g)$/,'');
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
}
function normExpr(s){
  return String(s).toLowerCase().replace(/[\s  ]/g,'').replace(/[×·]/g,'*').replace(/[−–—]/g,'-')
    .replace(/²/g,'^2').replace(/³/g,'^3').replace(/,/g,'.');
}
function parsePoly(s){
  if(!s || /[()]/.test(s)) return null;
  var terms = s.match(/[+-]?[^+-]+/g);
  if(!terms || terms.join('')!==s) return null;
  var map = {}, dupe = false;
  for(var i=0;i<terms.length;i++){
    var t = terms[i], sign = 1;
    if(t[0]==='+') t = t.slice(1); else if(t[0]==='-'){ sign=-1; t=t.slice(1); }
    if(!t) return null;
    var re = /(\d+(?:\.\d+)?)|([a-z])(?:\^(\d))?|\*/g, m, pos = 0, coef = 1, ex = {}, any = false;
    while((m = re.exec(t))){
      if(m.index!==pos) return null;
      pos = re.lastIndex; any = true;
      if(m[1]!==undefined) coef *= parseFloat(m[1]);
      else if(m[2]!==undefined) ex[m[2]] = (ex[m[2]]||0) + (m[3]?+m[3]:1);
    }
    if(!any || pos!==t.length) return null;
    var key = Object.keys(ex).sort().map(function(k){return k+'^'+ex[k];}).join('*');
    if(key in map) dupe = true;
    map[key] = (map[key]||0) + sign*coef;
  }
  return {map:map, dupe:dupe};
}
function samePoly(a,b){
  var ka = Object.keys(a).filter(function(k){return Math.abs(a[k])>1e-12;}), kb = Object.keys(b).filter(function(k){return Math.abs(b[k])>1e-12;});
  if(ka.length!==kb.length) return false;
  return ka.every(function(k){ return Math.abs(a[k]-(b[k]||0))<1e-9; });
}
function check(q, raw){
  if(q.t==='num'){
    var v = normNum(raw);
    if(isNaN(v)) return {ok:false, msg:'Écris un nombre (par exemple 36).'};
    return {ok: Math.abs(v-q.a)<1e-9};
  }
  if(q.t==='frac'){
    var rs = String(raw).replace(/[\s\u00a0\u202f]/g,'').replace(/[÷:]/g,'/').replace(/[−–—]/g,'-');
    var mm = /^(\d+)\/(\d+)$/.exec(rs), fn, fd;
    if(mm){ fn = +mm[1]; fd = +mm[2]; if(fd===0) return {ok:false, msg:'Le dénominateur ne peut pas être 0.'}; }
    else { var iv = normNum(rs); if(!isNaN(iv) && iv===Math.floor(iv) && iv>=0){ fn = iv; fd = 1; } else return {ok:false, msg:'Écris une fraction, par exemple 3/4.'}; }
    var tp = String(q.a).split('/'), tn = +tp[0], td = tp.length>1 ? +tp[1] : 1;
    if(fn*td !== tn*fd) return {ok:false};
    if(q.den!==undefined && fd!==q.den) return {ok:false, msg:'Ta valeur est bonne, mais on demande une fraction de dénominateur '+q.den+'.'};
    if(q.irr){ var gg = (function g(a,b){ return b?g(b,a%b):a; })(fn,fd); if(gg>1 && fn!==0) return {ok:false, msg:'Ta fraction est juste, mais elle peut encore être simplifiée.'}; }
    return {ok:true};
  }
  if(q.t==='pow'){
    var p = String(raw).toLowerCase().replace(/[\s ]/g,'').replace(/²/g,'^2').replace(/³/g,'^3').replace('**','^');
    return {ok: p===q.a};
  }
  if(q.t==='expr'){
    var n = normExpr(raw);
    if(!n) return {ok:false, msg:'Écris une expression.'};
    var bare = n.replace(/\^\d/g,'');
    if(/[a-z]\d/.test(bare)) return {ok:false, msg:'Attention : le nombre se place devant la lettre (5x et non x5).'};
    if(/([a-z])\1/.test(bare)) return {ok:false, msg:'Utilise une puissance : x × x s’écrit x².'};
    if(q.strict && n.indexOf('*')>=0) return {ok:false, msg:'Simplifie l’écriture : le signe × peut être masqué.'};
    if(q.paren){
      var m = n.replace(/\*/g,'');
      if(q.accept.indexOf(m)>=0) return {ok:true};
      if(q.soft && q.soft.indexOf(m)>=0) return {ok:true, note:q.note};
      return {ok:false};
    }
    var a = parsePoly(n), b = parsePoly(normExpr(q.a));
    if(!a || !b) return {ok:false};
    if(!samePoly(a.map,b.map)) return {ok:false};
    if(q.reduced && a.dupe) return {ok:false, msg:'Ton expression est juste, mais pas encore réduite : regroupe les termes semblables.'};
    return {ok:true};
  }
  return {ok:false};
}
window.__check = check;

/* ---------- figures ---------- */
function figAngles(kind, hi){
  hi = hi||[];
  var par = kind==='par';
  var A = {x:187,y:70}, B = {x:150,y:150};
  var slope = par ? 0 : 0.07;
  var yd2 = function(x){ return 150 + slope*(x-150); };
  var off = {1:[22,-14],2:[-14,-22],3:[-22,14],4:[14,22]};
  var nb = function(P,n,base){
    var o = off[base];
    var cls = hi.indexOf(n)>=0 ? 'nb hi' : 'nb';
    return '<g class="'+cls+'"><circle cx="'+(P.x+o[0])+'" cy="'+(P.y+o[1])+'" r="10"/><text x="'+(P.x+o[0])+'" y="'+(P.y+o[1])+'">'+n+'</text></g>';
  };
  var s = '<svg viewBox="0 0 390 220" role="img" aria-label="Deux droites coupées par une sécante, avec huit angles numérotés de 1 à 8">';
  s += '<line class="ln" x1="20" y1="70" x2="350" y2="70"/>';
  s += '<line class="ln" x1="20" y1="'+yd2(20)+'" x2="350" y2="'+yd2(350)+'"/>';
  s += '<line class="ln" x1="126.7" y1="200" x2="210.3" y2="20"/>';
  if(par){
    s += '<polyline class="mk" points="296,64 302,70 296,76"/><polyline class="mk" points="296,144 302,150 296,156"/>';
  }
  s += '<text class="tx" x="358" y="75">(d)</text><text class="tx" x="358" y="'+(yd2(350)+5)+'">(d′)</text><text class="tx" x="216" y="22">(s)</text>';
  [1,2,3,4].forEach(function(i){ s += nb(A,i,i); });
  [5,6,7,8].forEach(function(i){ s += nb(B,i,i-4); });
  return s + '</svg>';
}
function figGrid(g, hi){
  hi = hi||[];
  var s = 24, pad = 12, W = g.W, H = g.H, w = W*s+2*pad, h = H*s+2*pad, i;
  function X(x){ return pad + x*s; } function Y(y){ return pad + (H-y)*s; }
  var o = '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Quadrillage avec le vecteur EF, le triangle ABC et des points proposés">';
  o += '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="ahd"/></marker></defs>';
  for(i=0;i<=W;i++) o += '<line class="gl" x1="'+X(i)+'" y1="'+pad+'" x2="'+X(i)+'" y2="'+(h-pad)+'"/>';
  for(i=0;i<=H;i++) o += '<line class="gl" x1="'+pad+'" y1="'+Y(i)+'" x2="'+(w-pad)+'" y2="'+Y(i)+'"/>';
  var names = Object.keys(g.poly||{});
  if(names.length){
    o += '<polygon class="pg" points="'+names.map(function(n){ return X(g.poly[n][0])+','+Y(g.poly[n][1]); }).join(' ')+'"/>';
  }
  o += '<line class="vc" x1="'+X(g.E[0])+'" y1="'+Y(g.E[1])+'" x2="'+X(g.F[0])+'" y2="'+Y(g.F[1])+'" marker-end="url(#ah)"/>';
  function dot(n,p,dx,dy){ return '<circle class="pt" cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="3.5"/><text class="tx" x="'+(X(p[0])+dx)+'" y="'+(Y(p[1])+dy)+'">'+n+'</text>'; }
  names.forEach(function(n){ o += dot(n,g.poly[n],(n==='B'?-4:-14),(n==='B'?-9:14)); });
  o += dot('E',g.E,-14,14) + dot('F',g.F,6,-6);
  Object.keys(g.c||{}).forEach(function(L){
    var p = g.c[L], on = hi.indexOf(L)>=0;
    o += '<g class="'+(on?'nb hi':'nb')+'"><circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="10"/><text x="'+X(p[0])+'" y="'+Y(p[1])+'">'+L+'</text></g>';
  });
  return o + '</svg>';
}
function figLine(g, hi){
  hi = hi||[];
  var x0 = 26, x1 = 346, total = g.N*g.p, st = (x1-x0)/total, y = 56, i;
  var o = '<svg viewBox="0 0 380 100" role="img" aria-label="Demi-droite graduée avec des points">';
  o += '<line class="ln" x1="'+(x0-10)+'" y1="'+y+'" x2="372" y2="'+y+'"/><polyline class="ln" points="364,50 372,'+y+' 364,62"/>';
  for(i=0;i<=total;i++){
    var x = x0+i*st, major = i%g.p===0;
    o += '<line class="ln" style="stroke-width:'+(major?2:1.4)+'" x1="'+x+'" y1="'+(y-(major?9:5))+'" x2="'+x+'" y2="'+(y+(major?9:5))+'"/>';
    if(major) o += '<text class="tx" style="font-style:normal" x="'+(x-4)+'" y="'+(y+28)+'">'+(i/g.p)+'</text>';
  }
  Object.keys(g.pts).forEach(function(n){
    var x = x0+g.pts[n]*st, on = hi.indexOf(n)>=0;
    o += '<circle cx="'+x+'" cy="'+y+'" r="'+(on?7:5)+'" style="fill:'+(on?'var(--hl)':'var(--accent)')+';stroke:var(--ink);stroke-width:1.5"/><text class="tx" x="'+(x-5)+'" y="'+(y-16)+'">'+n+'</text>';
  });
  return o + '</svg>';
}
function figCircle(g, hi){
  hi = hi||[];
  var cx = 190, cy = 110, r = 85;
  function P(a){ return [cx + r*Math.cos(a*Math.PI/180), cy - r*Math.sin(a*Math.PI/180)]; }
  var pts = {A:130,B:50,C:200,D:20,E:290}, xy = {}; Object.keys(pts).forEach(function(k){ xy[k] = P(pts[k]); });
  var o = '<svg viewBox="0 0 380 220" role="img" aria-label="Cercle de centre O avec des segments [AB], [CD] et [OE]">';
  o += '<circle class="ln" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>';
  [['A','B'],['C','D']].forEach(function(s){ o += '<line class="ln" style="stroke:'+((hi.indexOf(s[0])>=0)?'var(--accent)':'var(--ink)')+';stroke-width:'+((hi.indexOf(s[0])>=0)?3.5:2)+'" x1="'+xy[s[0]][0]+'" y1="'+xy[s[0]][1]+'" x2="'+xy[s[1]][0]+'" y2="'+xy[s[1]][1]+'"/>'; });
  o += '<line class="ln" style="stroke:'+((hi.indexOf('E')>=0)?'var(--accent)':'var(--ink)')+';stroke-width:'+((hi.indexOf('E')>=0)?3.5:2)+'" x1="'+cx+'" y1="'+cy+'" x2="'+xy.E[0]+'" y2="'+xy.E[1]+'"/>';
  Object.keys(xy).forEach(function(k){
    var a = pts[k], lx = cx + (r+16)*Math.cos(a*Math.PI/180) - 5, ly = cy - (r+16)*Math.sin(a*Math.PI/180) + 5;
    o += '<circle cx="'+xy[k][0]+'" cy="'+xy[k][1]+'" r="3.5" style="fill:var(--ink)"/><text class="tx" x="'+lx+'" y="'+ly+'">'+k+'</text>';
  });
  o += '<circle cx="'+cx+'" cy="'+cy+'" r="3.5" style="fill:var(--ink)"/><text class="tx" x="'+(cx+6)+'" y="'+(cy+18)+'">O</text>';
  return o + '</svg>';
}
function figPath(g, hi){
  hi = hi||[];
  var names = ['A','C','D','E','B'], x0 = 34, st = 78, y = 50;
  var o = '<svg viewBox="0 0 380 100" role="img" aria-label="Segment AB partagé en quatre parties égales par les points C, D et E">';
  o += '<line class="ln" x1="'+x0+'" y1="'+y+'" x2="'+(x0+4*st)+'" y2="'+y+'"/>';
  names.forEach(function(n,i){
    var x = x0+i*st, on = hi.indexOf(n)>=0;
    o += '<line class="ln" x1="'+x+'" y1="'+(y-8)+'" x2="'+x+'" y2="'+(y+8)+'"/><circle cx="'+x+'" cy="'+y+'" r="'+(on?7:4)+'" style="fill:'+(on?'var(--hl)':'var(--ink)')+';stroke:var(--ink);stroke-width:1.5"/><text class="tx" x="'+(x-5)+'" y="'+(y-18)+'">'+n+'</text>';
  });
  return o + '</svg>';
}
function figure(q, hi){
  if(q.fig==='tr') return figGrid(q.g, hi);
  if(q.fig==='dg') return figLine(q.g, hi);
  if(q.fig==='ci') return figCircle(q.g, hi);
  if(q.fig==='sn') return figPath(q.g, hi);
  return figAngles(q.fig, hi);
}
